<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 770" width="1440" height="770" role="img" aria-labelledby="atomic-publication-title atomic-publication-desc">
  <title id="atomic-publication-title">Manifest-last atomic evidence publication</title>
  <desc id="atomic-publication-desc">Seven source-derived steps show capture validation, staging, writing 49 artifacts, writing the manifest last, verifying, same-parent rename, and final verification.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #18243C; }
    .title { font-size: 34px; font-weight: 750; letter-spacing: -0.5px; }
    .subtitle { font-size: 17px; fill: #53627A; }
    .section { font-size: 21px; font-weight: 720; }
    .node-title { font-size: 18px; font-weight: 720; }
    .body { font-size: 16px; }
    .small { font-size: 14px; fill: #53627A; }
    .tiny { font-size: 12px; fill: #53627A; }
    .eyebrow { font-size: 11px; font-weight: 750; fill: #53627A; letter-spacing: 1.2px; }
    .pill { font-size: 12px; font-weight: 750; }
    .metric { font-size: 35px; font-weight: 780; }
    .metric-label { font-size: 14px; font-weight: 650; fill: #53627A; }
    .axis { font-size: 12px; fill: #53627A; }
    .bar-value { font-size: 12px; font-weight: 720; }
    .inverse { fill: #FFFFFF; }
  </style>
  <rect width="1440" height="770" fill="#F6F8FC"/>
  <defs><marker id="publication-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2359C4"/></marker><marker id="publication-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A8B4C8"/></marker></defs><text x="64" y="68" class="title" >Manifest-last atomic evidence publication</text><text x="64" y="101" class="subtitle" >The final directory is exposed only after every artifact and the last-written manifest verify.</text><circle cx="135" cy="177" r="19" fill="#2359C4"/><text x="135" y="183" class="pill inverse" text-anchor="middle">1</text><rect x="52" y="215" width="166" height="160" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="135" y="250" class="node-title" text-anchor="middle"><tspan x="135" dy="0">Validate</tspan><tspan x="135" dy="21">capture</tspan></text><text x="135" y="309" class="small" text-anchor="middle">closed capability</text><text x="135" y="334" class="small" text-anchor="middle">49 exact artifacts</text><circle cx="326" cy="177" r="19" fill="#2359C4"/><text x="326" y="183" class="pill inverse" text-anchor="middle">2</text><rect x="243" y="215" width="166" height="160" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="326" y="250" class="node-title" text-anchor="middle"><tspan x="326" dy="0">Create</tspan><tspan x="326" dy="21">stage</tspan></text><text x="326" y="309" class="small" text-anchor="middle">owned sibling</text><text x="326" y="334" class="small" text-anchor="middle">repository modes</text><circle cx="517" cy="177" r="19" fill="#2359C4"/><text x="517" y="183" class="pill inverse" text-anchor="middle">3</text><rect x="434" y="215" width="166" height="160" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="517" y="250" class="node-title" text-anchor="middle"><tspan x="517" dy="0">Write</tspan><tspan x="517" dy="21">artifacts</tspan></text><text x="517" y="309" class="small" text-anchor="middle">stable sorted files</text><text x="517" y="334" class="small" text-anchor="middle">manifest absent</text><circle cx="708" cy="177" r="19" fill="#2359C4"/><text x="708" y="183" class="pill inverse" text-anchor="middle">4</text><rect x="625" y="215" width="166" height="160" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="708" y="250" class="node-title" text-anchor="middle"><tspan x="708" dy="0">Write manifest</tspan><tspan x="708" dy="21">last</tspan></text><text x="708" y="309" class="small" text-anchor="middle">MANIFEST.json</text><text x="708" y="334" class="small" text-anchor="middle">visibility marker</text><circle cx="899" cy="177" r="19" fill="#2359C4"/><text x="899" y="183" class="pill inverse" text-anchor="middle">5</text><rect x="816" y="215" width="166" height="160" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="899" y="250" class="node-title" text-anchor="middle"><tspan x="899" dy="0">Sync + verify</tspan><tspan x="899" dy="21">stage</tspan></text><text x="899" y="309" class="small" text-anchor="middle">exact topology</text><text x="899" y="334" class="small" text-anchor="middle">semantic checks</text><circle cx="1090" cy="177" r="19" fill="#087A6A"/><text x="1090" y="183" class="pill inverse" text-anchor="middle">6</text><rect x="1007" y="215" width="166" height="160" rx="16" fill="#DFF5F0" stroke="#087A6A" stroke-width="2" /><text x="1090" y="250" class="node-title" text-anchor="middle"><tspan x="1090" dy="0">Same-parent</tspan><tspan x="1090" dy="21">rename</tspan></text><text x="1090" y="309" class="small" text-anchor="middle">single visibility</text><text x="1090" y="334" class="small" text-anchor="middle">commit point</text><circle cx="1281" cy="177" r="19" fill="#087A6A"/><text x="1281" y="183" class="pill inverse" text-anchor="middle">7</text><rect x="1198" y="215" width="166" height="160" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="1281" y="250" class="node-title" text-anchor="middle"><tspan x="1281" dy="0">Sync + verify</tspan><tspan x="1281" dy="21">final</tspan></text><text x="1281" y="309" class="small" text-anchor="middle">re-bind inode</text><text x="1281" y="334" class="small" text-anchor="middle">reopen receipt</text><line x1="218" y1="295" x2="231" y2="295" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#publication-arrow)"/><line x1="409" y1="295" x2="422" y2="295" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#publication-arrow)"/><line x1="600" y1="295" x2="613" y2="295" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#publication-arrow)"/><line x1="791" y1="295" x2="804" y2="295" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#publication-arrow)"/><line x1="982" y1="295" x2="995" y2="295" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#publication-arrow)"/><line x1="1173" y1="295" x2="1186" y2="295" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#publication-arrow)"/><line x1="995" y1="165" x2="995" y2="430" stroke="#9A5300" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><rect x="897" y="410" width="196" height="32" rx="16" fill="#FFF0D5" stroke="#FFF0D5" stroke-width="2" /><text x="995" y="432" class="pill" text-anchor="middle" style="fill:#9A5300">VISIBILITY BOUNDARY</text><rect x="78" y="495" width="602" height="182" rx="20" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><rect x="106" y="521" width="148" height="32" rx="16" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2" /><text x="180" y="543" class="pill" text-anchor="middle" style="fill:#2359C4">BEFORE RENAME</text><text x="106" y="577" class="small" ><tspan x="106" dy="0">Destination must be absent.</tspan><tspan x="106" dy="28">A failure removes only the bounded owned stage.</tspan><tspan x="106" dy="28">Unknown links, modes or topology are rejected.</tspan></text><rect x="760" y="495" width="602" height="182" rx="20" fill="#FFFFFF" stroke="#087A6A" stroke-width="2" /><rect x="788" y="521" width="140" height="32" rx="16" fill="#DFF5F0" stroke="#DFF5F0" stroke-width="2" /><text x="858" y="543" class="pill" text-anchor="middle" style="fill:#087A6A">AFTER RENAME</text><text x="788" y="577" class="small" ><tspan x="788" dy="0">The directory is visible under its final name.</tspan><tspan x="788" dy="28">Parent fsync, inode re-bind and full verification follow.</tspan><tspan x="788" dy="28">Existing outputs are never replaced.</tspan></text><text x="720" y="724" class="small" text-anchor="middle">Supported boundary: owned local Linux filesystem · one cooperative same-process writer</text>
</svg>

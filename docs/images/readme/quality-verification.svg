="267" class="body" >0 failed · 0 skipped</text><text x="966" y="295" class="small" >0 cancelled · 0 todo</text><text x="966" y="324" class="small" >669,256.84105 ms</text><text x="776" y="336" class="tiny" >log cc840933d18c17869526c2190167949ecb1b932980207be5361ce5e01ac40a98</text><rect x="64" y="384" width="1312" height="294" rx="22" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="92" y="426" class="section" >Loaded JavaScript coverage totals</text><rect x="1010" y="401" width="338" height="32" rx="16" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2" /><text x="1179" y="423" class="pill" text-anchor="middle" style="fill:#2359C4">CURRENT FLOOR · L90 / B83 / F95</text><text x="324" y="458" class="axis" >0%</text><text x="1284" y="458" class="axis" text-anchor="end">100%</text><text x="92" y="508" class="node-title" >Lines</text><rect x="324" y="486" width="960" height="28" rx="8" fill="#EEF1F6" stroke="#EEF1F6" stroke-width="2" /><rect x="324" y="486" width="871.68" height="28" rx="8" fill="#2359C4" stroke="#2359C4" stroke-width="2" /><line x1="1188" y1="481" x2="1188" y2="519" stroke="#18243C" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="1328" y="507" class="bar-value" text-anchor="end">90.80%</text><text x="92" y="570" class="node-title" >Branches</text><rect x="324" y="548" width="960" height="28" rx="8" fill="#EEF1F6" stroke="#EEF1F6" stroke-width="2" /><rect x="324" y="548" width="800.6400000000001" height="28" rx="8" fill="#087A6A" stroke="#087A6A" stroke-width="2" /><line x1="1120.8" y1="543" x2="1120.8" y2="581" stroke="#18243C" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="1328" y="569" class="bar-value" text-anchor="end">83.40%</text><text x="92" y="632" class="node-title" >Functions</text><rect x="324" y="610" width="960" height="28" rx="8" fill="#EEF1F6" stroke="#EEF1F6" stroke-width="2" /><rect x="324" y="610" width="917.6640000000001" height="28" rx="8" fill="#6842B8" stroke="#6842B8" stroke-width="2" /><line x1="1236" y1="605" x2="1236" y2="643" stroke="#18243C" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="1328" y="631" class="bar-value" text-anchor="end">95.59%</text><text x="92" y="654" class="small" >Scope: all loaded emitted JavaScript under dist, including dist/src + dist/test.</text><rect x="64" y="716" width="1312" height="142" rx="22" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><rect x="92" y="742" width="182" height="32" rx="16" fill="#EEF1F6" stroke="#EEF1F6" stroke-width="2" /><text x="183" y="764" class="pill" text-anchor="middle" style="fill:#53627A">SCOPE + RECEIPT</text><text x="92" y="798" class="small" ><tspan x="92" dy="0">Bars: recorded Node 22.23.1 coverage:check totals; raw TAP is bound by SHA-256.</tspan><tspan x="92" dy="28">Markers: enforced 90% line, 83% branch, and 95% function minimums.</tspan></text><rect x="944" y="742" width="174" height="32" rx="16" fill="#FDE8E6" stroke="#FDE8E6" stroke-width="2" /><text x="1031" y="764" class="pill" text-anchor="middle" style="fill:#A83930">DOES NOT ESTABLISH</text><text x="944" y="798" class="small" ><tspan x="944" dy="0">production-browser compatibility · model quality</tspan><tspan x="944" dy="28">benchmark performance · equal Node 24 coverage totals</tspan></text>

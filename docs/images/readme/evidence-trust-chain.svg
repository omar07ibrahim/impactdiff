<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 830" width="1440" height="830" role="img" aria-labelledby="evidence-trust-chain-title evidence-trust-chain-desc">
  <title id="evidence-trust-chain-title">Evidence trust chain and byte bindings</title>
  <desc id="evidence-trust-chain-desc">Five source-derived trust stages bind a clean Git baseline, pinned runtime, replay identities, artifact byte references, and exact publication topology to one non-official evidence manifest.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #18243C; }
    .title { font-size: 34px; font-weight: 750; letter-spacing: -0.5px; }
    .subtitle { font-size: 17px; fill: #53627A; }
    .section { font-size: 21px; font-weight: 720; }
    .node-title { font-size: 18px; font-weight: 720; }
    .body { font-size: 16px; }
    .small { font-size: 14px; fill: #53627A; }
    .tiny { font-size: 12px; fill: #53627A; }
    .eyebrow { font-size: 11px; font-weight: 750; fill: #53627A; letter-spacing: 1.2px; }
    .pill { font-size: 12px; font-weight: 750; }
    .metric { font-size: 35px; font-weight: 780; }
    .metric-label { font-size: 14px; font-weight: 650; fill: #53627A; }
    .axis { font-size: 12px; fill: #53627A; }
    .bar-value { font-size: 12px; font-weight: 720; }
    .inverse { fill: #FFFFFF; }
  </style>
  <rect width="1440" height="830" fill="#F6F8FC"/>
  <defs><marker id="trust-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2359C4"/></marker><marker id="trust-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A8B4C8"/></marker></defs><text x="64" y="68" class="title" >Evidence trust chain</text><text x="64" y="101" class="subtitle" >Source, runtime, replay and artifact bytes converge on one inspectable receipt.</text><rect x="55" y="198" width="242" height="160" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="75" y="227" class="eyebrow" >1 · SOURCE</text><text x="75" y="256" class="node-title" >Committed source</text><text x="75" y="282" class="small" ><tspan x="75" dy="0">Git revision + tree</tspan><tspan x="75" dy="21">root + authored + compiled</tspan><tspan x="75" dy="21">SHA-256 identities</tspan></text><rect x="331" y="198" width="242" height="160" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="351" y="227" class="eyebrow" >2 · RUNTIME</text><text x="351" y="256" class="node-title" >Pinned runtime</text><text x="351" y="282" class="small" ><tspan x="351" dy="0">Node 22.23.1 · ABI 127</tspan><tspan x="351" dy="21">Playwright 1.61.1</tspan><tspan x="351" dy="21">Chromium 149.0.7827.55</tspan></text><rect x="607" y="198" width="242" height="160" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="627" y="227" class="eyebrow" >3 · REPLAY</text><text x="627" y="256" class="node-title" >Closed replay IDs</text><text x="627" y="282" class="small" ><tspan x="627" dy="0">fixture · source · task</tspan><tspan x="627" dy="21">environment · checkpoint</tspan><tspan x="627" dy="21">audited resources and lifecycle</tspan></text><rect x="883" y="198" width="242" height="160" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="903" y="227" class="eyebrow" >4 · ARTIFACTS</text><text x="903" y="256" class="node-title" >Artifact byte refs</text><text x="903" y="282" class="small" ><tspan x="903" dy="0">file · media type · byte length</tspan><tspan x="903" dy="21">SHA-256 for every artifact</tspan><tspan x="903" dy="21">PNG 800×600 · AX · layout</tspan></text><rect x="1159" y="198" width="242" height="160" rx="16" fill="#DFF5F0" stroke="#087A6A" stroke-width="2" /><text x="1179" y="227" class="eyebrow" >5 · PUBLICATION</text><text x="1179" y="256" class="node-title" >Exact 50-file topology</text><text x="1179" y="282" class="small" ><tspan x="1179" dy="0">49 artifacts + MANIFEST</tspan><tspan x="1179" dy="21">unknown and missing files fail</tspan><tspan x="1179" dy="21">manifest written last</tspan></text><line x1="297" y1="278" x2="319" y2="278" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#trust-arrow)"/><line x1="573" y1="278" x2="595" y2="278" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#trust-arrow)"/><line x1="849" y1="278" x2="871" y2="278" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#trust-arrow)"/><line x1="1125" y1="278" x2="1147" y2="278" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#trust-arrow)"/><rect x="92" y="438" width="1256" height="232" rx="22" fill="#FFFFFF" stroke="#2359C4" stroke-width="2" /><rect x="120" y="466" width="150" height="32" rx="16" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2" /><text x="195" y="488" class="pill" text-anchor="middle" style="fill:#2359C4">BOUND RECEIPT</text><text x="120" y="533" class="section" >MANIFEST.json</text><text x="120" y="570" class="body" >SHA-256 binds canonical manifest bytes</text><text x="120" y="605" class="small" >2 fixtures · 4 workflows · 12 checkpoints · 50 exact files · official: false</text><line x1="816" y1="470" x2="816" y2="638" stroke="#CDD5E3" stroke-width="3" stroke-linecap="round" /><text x="850" y="500" class="section" >Freshness check</text><text x="850" y="536" class="small" ><tspan x="850" dy="0">Recorded revision must be current or an ancestor.</tspan><tspan x="850" dy="26">Tracked root, source and fixture bytes must still match.</tspan><tspan x="850" dy="26">Compiled runtime bytes must still match.</tspan><tspan x="850" dy="26">Worktree must be globally clean.</tspan></text><rect x="92" y="712" width="136" height="32" rx="16" fill="#DFF5F0" stroke="#DFF5F0" stroke-width="2" /><text x="160" y="734" class="pill" text-anchor="middle" style="fill:#087A6A">ESTABLISHES</text><text x="248" y="733" class="small" >deterministic local replay · checkpoint byte identities · closed environment bindings</text><rect x="92" y="758" width="174" height="32" rx="16" fill="#FDE8E6" stroke="#FDE8E6" stroke-width="2" /><text x="179" y="780" class="pill" text-anchor="middle" style="fill:#A83930">DOES NOT ESTABLISH</text><text x="286" y="779" class="small" >official dataset · model quality · benchmark performance · production-browser compatibility</text>
</svg>

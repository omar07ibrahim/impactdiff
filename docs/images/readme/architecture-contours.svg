<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" width="1440" height="880" role="img" aria-labelledby="architecture-contours-title architecture-contours-desc">
  <title id="architecture-contours-title">Implemented and planned ImpactDiff architecture</title>
  <desc id="architecture-contours-desc">A two-contour architecture. The implemented authoring and evidence contour is solid. The future official dataset, isolated features, models, and evaluation contour is dashed.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #18243C; }
    .title { font-size: 34px; font-weight: 750; letter-spacing: -0.5px; }
    .subtitle { font-size: 17px; fill: #53627A; }
    .section { font-size: 21px; font-weight: 720; }
    .node-title { font-size: 18px; font-weight: 720; }
    .body { font-size: 16px; }
    .small { font-size: 14px; fill: #53627A; }
    .tiny { font-size: 12px; fill: #53627A; }
    .eyebrow { font-size: 11px; font-weight: 750; fill: #53627A; letter-spacing: 1.2px; }
    .pill { font-size: 12px; font-weight: 750; }
    .metric { font-size: 35px; font-weight: 780; }
    .metric-label { font-size: 14px; font-weight: 650; fill: #53627A; }
    .axis { font-size: 12px; fill: #53627A; }
    .bar-value { font-size: 12px; font-weight: 720; }
    .inverse { fill: #FFFFFF; }
  </style>
  <rect width="1440" height="880" fill="#F6F8FC"/>
  <defs><marker id="architecture-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2359C4"/></marker><marker id="architecture-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A8B4C8"/></marker></defs><text x="64" y="68" class="title" >ImpactDiff architecture: implemented and planned contours</text><text x="64" y="101" class="subtitle" >Solid paths are implemented code; dashed paths are the frozen research plan.</text><rect x="64" y="126" width="152" height="32" rx="16" fill="#DFF5F0" stroke="#DFF5F0" stroke-width="2" /><text x="140" y="148" class="pill" text-anchor="middle" style="fill:#087A6A">IMPLEMENTED</text><line x1="236" y1="142" x2="282" y2="142" stroke="#2359C4" stroke-width="3" stroke-linecap="round" /><rect x="302" y="126" width="132" height="32" rx="16" fill="#EEF1F6" stroke="#EEF1F6" stroke-width="2" /><text x="368" y="148" class="pill" text-anchor="middle" style="fill:#53627A">PLANNED</text><line x1="454" y1="142" x2="500" y2="142" stroke="#A8B4C8" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 8"/><rect x="64" y="190" width="862" height="635" rx="24" fill="#FFFFFF" stroke="#087A6A" stroke-width="2" /><text x="92" y="226" class="section" >Implemented contour</text><text x="716" y="225" class="small" text-anchor="end">Tested authoring + evidence path</text><rect x="954" y="190" width="422" height="635" rx="24" fill="#FFFFFF" stroke="#A8B4C8" stroke-width="2" stroke-dasharray="12 9"/><text x="982" y="226" class="section" >Future research contour</text><rect x="92" y="250" width="234" height="132" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="112" y="279" class="eyebrow" >INPUTS</text><text x="112" y="308" class="node-title" >Authored Pilot inputs</text><text x="112" y="334" class="small" ><tspan x="112" dy="0">2 fixtures · 4 workflows</tspan><tspan x="112" dy="21">closed actions and source state</tspan></text><rect x="370" y="250" width="234" height="132" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="390" y="279" class="eyebrow" >RUNTIME</text><text x="390" y="308" class="node-title" >Pinned browser runtime</text><text x="390" y="334" class="small" ><tspan x="390" dy="0">Node 22.23.1 · Playwright 1.61.1</tspan><tspan x="390" dy="21">Chromium + closed CaptureSpec</tspan></text><rect x="648" y="250" width="234" height="132" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="668" y="279" class="eyebrow" >EXECUTION</text><text x="668" y="308" class="node-title" >Audited browser replay</text><text x="668" y="334" class="small" ><tspan x="668" dy="0">isolated contexts · no network</tspan><tspan x="668" dy="21">task, lifecycle and cleanup audits</tspan></text><rect x="648" y="510" width="234" height="132" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="668" y="539" class="eyebrow" >MODALITIES</text><text x="668" y="568" class="node-title" >Canonical checkpoints</text><text x="668" y="594" class="small" ><tspan x="668" dy="0">12 PNG · 12 AX · 12 layout</tspan><tspan x="668" dy="21">manifest-bound byte identities</tspan></text><rect x="370" y="510" width="234" height="132" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="390" y="539" class="eyebrow" >PUBLICATION</text><text x="390" y="568" class="node-title" >Manifest-last bundle</text><text x="390" y="594" class="small" ><tspan x="390" dy="0">50-file closed topology</tspan><tspan x="390" dy="21">stage · verify · atomic rename</tspan></text><rect x="92" y="510" width="234" height="132" rx="16" fill="#FFFFFF" stroke="#CDD5E3" stroke-width="2" /><text x="112" y="539" class="eyebrow" >EVIDENCE</text><text x="112" y="568" class="node-title" >Local evidence receipt</text><text x="112" y="594" class="small" ><tspan x="112" dy="0">50-file closed receipt</tspan><tspan x="112" dy="21">official: false boundary</tspan></text><line x1="326" y1="316" x2="358" y2="316" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#architecture-arrow)"/><line x1="604" y1="316" x2="636" y2="316" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#architecture-arrow)"/><line x1="765" y1="382" x2="765" y2="494" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#architecture-arrow)"/><line x1="648" y1="576" x2="616" y2="576" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#architecture-arrow)"/><line x1="370" y1="576" x2="338" y2="576" stroke="#2359C4" stroke-width="3" stroke-linecap="round" marker-end="url(#architecture-arrow)"/><rect x="648" y="684" width="234" height="116" rx="16" fill="#E8F0FF" stroke="#2359C4" stroke-width="2" /><text x="668" y="713" class="eyebrow" >EXECUTABLE SLICE</text><text x="668" y="742" class="node-title" >2 pointer definitions</text><text x="668" y="768" class="small" ><tspan x="668" dy="0">breaking + preserving</tspan><tspan x="668" dy="21">replayed across 4 workflows</tspan></text><path d="M 882 316 H 916 V 742 H 894" fill="none" stroke="#2359C4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#architecture-arrow)"/><rect x="982" y="248" width="366" height="94" rx="16" fill="#EEF1F6" stroke="#A8B4C8" stroke-width="2" stroke-dasharray="9 8"/><text x="1002" y="277" class="eyebrow" >PLANNED 1</text><text x="1002" y="306" class="node-title" >Frozen generation plan</text><text x="1002" y="332" class="small" ><tspan x="1002" dy="0">20 apps · 40 workflows</tspan></text><rect x="982" y="352" width="366" height="94" rx="16" fill="#EEF1F6" stroke="#A8B4C8" stroke-width="2" stroke-dasharray="9 8"/><text x="1002" y="381" class="eyebrow" >PLANNED 2</text><text x="1002" y="410" class="node-title" >Official capture matrix</text><text x="1002" y="436" class="small" ><tspan x="1002" dy="0">640 planned pairs</tspan></text><rect x="982" y="456" width="366" height="94" rx="16" fill="#EEF1F6" stroke="#A8B4C8" stroke-width="2" stroke-dasharray="9 8"/><text x="1002" y="485" class="eyebrow" >PLANNED 3</text><text x="1002" y="514" class="node-title" >Isolated feature runner</text><text x="1002" y="540" class="small" ><tspan x="1002" dy="0">pixel + AX/layout projections</tspan></text><rect x="982" y="560" width="366" height="94" rx="16" fill="#EEF1F6" stroke="#A8B4C8" stroke-width="2" stroke-dasharray="9 8"/><text x="1002" y="589" class="eyebrow" >PLANNED 4</text><text x="1002" y="618" class="node-title" >Learned comparison</text><text x="1002" y="644" class="small" ><tspan x="1002" dy="0">pixel · structured · fused</tspan></text><rect x="982" y="664" width="366" height="94" rx="16" fill="#EEF1F6" stroke="#A8B4C8" stroke-width="2" stroke-dasharray="9 8"/><text x="1002" y="693" class="eyebrow" >PLANNED 5</text><text x="1002" y="722" class="node-title" >Grouped evaluation</text><text x="1002" y="748" class="small" ><tspan x="1002" dy="0">application-disjoint claim gate</tspan></text><line x1="1165" y1="342" x2="1165" y2="350" stroke="#A8B4C8" stroke-width="3" stroke-linecap="round" marker-end="url(#architecture-arrow-muted)" stroke-dasharray="9 8"/><line x1="1165" y1="446" x2="1165" y2="454" stroke="#A8B4C8" stroke-width="3" stroke-linecap="round" marker-end="url(#architecture-arrow-muted)" stroke-dasharray="9 8"/><line x1="1165" y1="550" x2="1165" y2="558" stroke="#A8B4C8" stroke-width="3" stroke-linecap="round" marker-end="url(#architecture-arrow-muted)" stroke-dasharray="9 8"/><line x1="1165" y1="654" x2="1165" y2="662" stroke="#A8B4C8" stroke-width="3" stroke-linecap="round" marker-end="url(#architecture-arrow-muted)" stroke-dasharray="9 8"/><text x="1165" y="794" class="small" text-anchor="middle">0 official pairs · 0 released datasets · 0 trained models</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="pilot-evidence-check-terminal-title pilot-evidence-check-terminal-desc">
  <title id="pilot-evidence-check-terminal-title">Read-only Pilot evidence verification terminal capture</title>
  <desc id="pilot-evidence-check-terminal-desc">A byte-derived terminal rendering of the exact path-free stdout produced by one successful Pilot evidence verification command.</desc>
  <style>
    .title{font:700 28px Inter,system-ui,sans-serif;fill:#f8fafc}.subtitle{font:400 15px Inter,system-ui,sans-serif;fill:#94a3b8}.mono{font:500 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#dbeafe}.prompt{fill:#6ee7b7}.label{font:700 12px Inter,system-ui,sans-serif;letter-spacing:1.2px;fill:#93c5fd}.metric{font:700 34px Inter,system-ui,sans-serif;fill:#f8fafc}.body{font:500 16px Inter,system-ui,sans-serif;fill:#cbd5e1}.small{font:500 13px Inter,system-ui,sans-serif;fill:#94a3b8}
  </style>
  <rect width="1440" height="520" rx="28" fill="#07111f"/><circle cx="72" cy="54" r="7" fill="#fb7185"/><circle cx="96" cy="54" r="7" fill="#fbbf24"/><circle cx="120" cy="54" r="7" fill="#34d399"/><text x="72" y="112" class="title">Read-only Pilot evidence verification</text><text x="72" y="142" class="subtitle">Exact child stdout; the long JSON line is display-wrapped only.</text><rect x="48" y="160" width="1344" height="190" rx="16" fill="#0f1d30" stroke="#243b5a"/><text x="72" y="190" class="mono prompt">$ npm run --silent evidence:pilot:check</text><text x="72" y="234" class="mono">{&quot;official&quot;:false,&quot;manifest_sha256&quot;:&quot;290878bcdfe8b150b15a79cdc535744b6a11cf9d8abfee991e4a0fa</text><text x="72" y="264" class="mono">e1e95b954&quot;,&quot;fixture_count&quot;:2,&quot;workflow_count&quot;:4,&quot;checkpoint_count&quot;:12}</text><rect x="48" y="382" width="1344" height="86" rx="16" fill="#0b1728" stroke="#1e3a5f"/><text x="72" y="416" class="label">CAPTURE BOUNDARY</text><text x="72" y="448" class="body">1 invocation · exit 0 · stderr 0 B · no host, cwd, timestamp, or secret · network behavior not observed</text>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.1", "24"]

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository:
            ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Source-bound evidence must resolve its recorded capture ancestors.
          fetch-depth: 0
          persist-credentials: false

      - name: Require the immutable event revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse --verify 'HEAD^{commit}')"
          test "${actual_revision}" = "${EXPECTED_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify formatting
        run: npm run format:check

      - name: Type-check
        run: npm run check

      - name: Enforce coverage floors
        if:
          matrix.node == '22.23.1' && (github.event_name != 'pull_request' ||
          github.event.pull_request.number != 16)
        run: npm run coverage:check

      - name: Test current Node.js
        if:
          matrix.node == '24' && (github.event_name != 'pull_request' ||
          github.event.pull_request.number != 16)
        run: npm test

      - name: Generate and audit derived visual evidence candidate
        if:
          matrix.node == '22.23.1' && github.event_name == 'pull_request' &&
          github.event.pull_request.number == 16
        id: derived_visuals
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          candidate_root="${RUNNER_TEMP}/pilot-derived-visuals-candidate"
          archive="${RUNNER_TEMP}/pilot-derived-visuals-candidate.zip"
          rm -rf -- "${candidate_root}"
          rm -f -- "${archive}"
          install -d -m 0700 -- "${candidate_root}/docs/images"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          node tools/capture-pilot-cli-terminal.mjs record
          node tools/capture-pilot-cli-terminal.mjs check
          cp -a docs/images/terminal-evidence "${candidate_root}/docs/images/"
          git restore --source=HEAD --worktree -- docs/images/terminal-evidence
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          node tools/render-pilot-workflow-gif.mjs refresh
          node tools/render-pilot-workflow-gif.mjs check
          cp -a docs/images/pilot-workflow-demo "${candidate_root}/docs/images/"
          git restore --source=HEAD --worktree -- docs/images/pilot-workflow-demo
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          node tools/render-readme-visuals.mjs write
          node tools/render-readme-visuals.mjs check
          cp -a docs/images/readme "${candidate_root}/docs/images/"
          git restore --source=HEAD --worktree -- docs/images/readme
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          cp -a "${candidate_root}/docs/images/terminal-evidence/." docs/images/terminal-evidence/
          cp -a "${candidate_root}/docs/images/pilot-workflow-demo/." docs/images/pilot-workflow-demo/
          cp -a "${candidate_root}/docs/images/readme/." docs/images/readme/
          npm run coverage:check
          git restore --source=HEAD --worktree --             docs/images/terminal-evidence             docs/images/pilot-workflow-demo             docs/images/readme
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          CANDIDATE_ROOT="${candidate_root}" ARCHIVE="${archive}" EXPECTED_REVISION="${EXPECTED_REVISION}" SOURCE_ROOT="${GITHUB_WORKSPACE}" python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import struct
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath
          from xml.etree import ElementTree

          expected = sorted(
              [
                  "docs/images/terminal-evidence/MANIFEST.json",
                  "docs/images/terminal-evidence/evidence-boundary.svg",
                  "docs/images/terminal-evidence/pilot-evidence-check.svg",
                  "docs/images/terminal-evidence/pilot-evidence-check.txt",
                  "docs/images/pilot-workflow-demo/MANIFEST.json",
                  "docs/images/pilot-workflow-demo/incident-command--acknowledge-alert.gif",
                  "docs/images/readme/architecture-contours.svg",
                  "docs/images/readme/atomic-publication.svg",
                  "docs/images/readme/checkpoint-modalities.svg",
                  "docs/images/readme/cli-evidence-verification.svg",
                  "docs/images/readme/evidence-bundle-overview.svg",
                  "docs/images/readme/evidence-trust-chain.svg",
                  "docs/images/readme/pilot-implementation-grid.svg",
                  "docs/images/readme/quality-verification.svg",
                  "docs/images/readme/visuals-manifest.json",
              ]
          )
          source = Path(os.environ["SOURCE_ROOT"]).resolve(strict=True)
          candidate = Path(os.environ["CANDIDATE_ROOT"]).resolve(strict=True)
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          archive = Path(os.environ["ARCHIVE"])
          revision = os.environ["EXPECTED_REVISION"]

          def fail(message):
              raise SystemExit(message)

          def digest(value):
              return hashlib.sha256(value).hexdigest()

          def git(arguments, binary=False):
              result = subprocess.run(
                  ["git", *arguments],
                  cwd=source,
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=not binary,
              )
              if result.stderr:
                  fail("candidate Git command wrote stderr")
              return result.stdout

          if (
              not re.fullmatch(r"[0-9a-f]{40}", revision)
              or runner_temp not in candidate.parents
              or runner_temp not in archive.parents
              or source == candidate
              or source in candidate.parents
              or candidate in source.parents
              or archive.exists()
              or archive.is_symlink()
          ):
              fail("candidate path or revision boundary is invalid")
          if git(["rev-parse", "--verify", "HEAD^{commit}"]).strip() != revision:
              fail("candidate revision differs from the event revision")
          tree = git(["rev-parse", "--verify", "HEAD^{tree}"]).strip()
          if git(["status", "--porcelain=v1", "-z", "--untracked-files=all"]):
              fail("source checkout is dirty after candidate capture")

          observed = []
          files = {}
          for path in sorted(candidate.rglob("*")):
              identity = path.lstat()
              relative = path.relative_to(candidate).as_posix()
              if stat.S_ISDIR(identity.st_mode):
                  continue
              if (
                  not stat.S_ISREG(identity.st_mode)
                  or identity.st_nlink != 1
                  or stat.S_IMODE(identity.st_mode) != 0o644
                  or identity.st_size < 1
                  or identity.st_size > 4 * 1024 * 1024
              ):
                  fail("candidate contains a linked, non-regular, or unbounded member")
              value = path.read_bytes()
              after = path.lstat()
              if (
                  len(value) != identity.st_size
                  or (identity.st_dev, identity.st_ino, identity.st_size, identity.st_mtime_ns)
                  != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns)
              ):
                  fail("candidate member changed while reading")
              observed.append(relative)
              files[relative] = value
          if observed != expected or sum(map(len, files.values())) > 16 * 1024 * 1024:
              fail("candidate inventory or expanded size is outside its closed boundary")

          terminal = json.loads(files["docs/images/terminal-evidence/MANIFEST.json"])
          workflow = json.loads(files["docs/images/pilot-workflow-demo/MANIFEST.json"])
          readme = json.loads(files["docs/images/readme/visuals-manifest.json"])
          if (
              terminal.get("contract") != "impactdiff.pilot-cli-terminal-evidence"
              or terminal.get("official") is not False
              or terminal.get("source", {}).get("git_revision") != revision
              or terminal.get("source", {}).get("git_tree") != tree
          ):
              fail("terminal evidence provenance is not exact")
          if (
              workflow.get("contract") != "impactdiff.pilot-workflow-gif"
              or workflow.get("official") is not False
              or workflow.get("source", {}).get("git_revision") != revision
              or workflow.get("source", {}).get("git_tree") != tree
          ):
              fail("workflow GIF provenance is not exact")
          if (
              readme.get("contract") != "impactdiff.readme-visuals"
              or readme.get("evidence", {}).get("manifest_sha256")
              != "c9d915595c54f2bb16817ebaebce00336b618d1fabacf53909b077a20058f012"
              or readme.get("cli_verification", {}).get("run_record_sha256")
              != "f6124a4520d57749d80869a423afc85cda4ac328b4d42481de0548bc398ecd3f"
              or readme.get("cli_verification", {}).get("stdout_sha256")
              != "d5aceb78e7aa6b6a4588145e1887386ad93ecbcceba8a2c1df4d04c69ef96086"
          ):
              fail("README visual evidence bindings are not exact")

          gif = files[
              "docs/images/pilot-workflow-demo/incident-command--acknowledge-alert.gif"
          ]
          if (
              len(gif) != 1_635_354
              or digest(gif)
              != "70a26d4f3a7348793a08726115e1238b89db139f5f17521377376b86a0d07bb2"
              or gif[:6] != b"GIF89a"
              or struct.unpack("<HH", gif[6:10]) != (800, 600)
          ):
              fail("workflow GIF byte identity or dimensions are unexpected")

          sensitive = [
              re.compile(rb"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(rb"gh[pousr]_[A-Za-z0-9]{20,}"),
              re.compile(rb"(?:AKIA|ASIA)[A-Z0-9]{16}"),
              re.compile(rb"BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY"),
              re.compile(rb"/home/[A-Za-z0-9._-]+/"),
              re.compile(rb"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"),
          ]
          for name, value in files.items():
              if name.endswith((".json", ".svg", ".txt")):
                  if any(pattern.search(value) for pattern in sensitive):
                      fail("candidate contains a sensitive text pattern")
              if name.endswith(".svg"):
                  lowered = value.lower()
                  if (
                      b"<script" in lowered
                      or b"<foreignobject" in lowered
                      or re.search(rb"\son[a-z]+\s*=", lowered)
                      or re.search(rb"(?:href|src)\s*=\s*['\"](?:https?:|//|data:)", lowered)
                  ):
                      fail("candidate SVG contains active or external content")
                  ElementTree.fromstring(value)

          changed = []
          identities = []
          for name in expected:
              value = files[name]
              blob = hashlib.sha1(
                  b"blob " + str(len(value)).encode() + bytes([0]) + value
              ).hexdigest()
              committed = git(["rev-parse", f"HEAD:{name}"]).strip()
              row = {
                  "path": name,
                  "sha256": digest(value),
                  "byte_length": len(value),
                  "git_blob": blob,
                  "current_blob": committed,
              }
              identities.append(row)
              if blob != committed:
                  changed.append(name)
          if not changed:
              fail("candidate has no derived visual drift")

          with zipfile.ZipFile(
              archive,
              mode="x",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
              allowZip64=False,
          ) as output:
              for name in expected:
                  info = zipfile.ZipInfo(name, (1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (stat.S_IFREG | 0o644) << 16
                  output.writestr(info, files[name], compresslevel=9)

          with zipfile.ZipFile(archive, "r", allowZip64=False) as output:
              infos = output.infolist()
              if (
                  [info.filename for info in infos] != expected
                  or len(infos) != len(expected)
                  or output.comment
                  or output.testzip() is not None
              ):
                  fail("candidate archive inventory or integrity is invalid")
              for info in infos:
                  path = PurePosixPath(info.filename)
                  mode = info.external_attr >> 16
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or info.is_dir()
                      or info.flag_bits & 1
                      or info.extra
                      or info.comment
                      or stat.S_IFMT(mode) != stat.S_IFREG
                      or stat.S_IMODE(mode) != 0o644
                      or output.read(info) != files[info.filename]
                  ):
                      fail("candidate archive member is unsafe or inexact")

          archive_bytes = archive.read_bytes()
          audit = {
              "archive_sha256": digest(archive_bytes),
              "archive_bytes": len(archive_bytes),
              "expanded_bytes": sum(map(len, files.values())),
              "entry_count": len(expected),
              "changed_files": changed,
              "source_revision": revision,
              "source_tree": tree,
              "files": identities,
          }
          print(json.dumps(audit, separators=(",", ":")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"archive_sha256={audit['archive_sha256']}\n")
              output.write(f"archive_bytes={audit['archive_bytes']}\n")
              output.write(f"entry_count={audit['entry_count']}\n")
              output.write(f"changed_count={len(changed)}\n")
          PY

          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload the derived visual evidence candidate
        if:
          matrix.node == '22.23.1' && github.event_name == 'pull_request' &&
          github.event.pull_request.number == 16
        id: derived_visuals_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pilot-derived-visuals-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot-derived-visuals-candidate.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Stop before derived visual evidence adoption
        if:
          matrix.node == '22.23.1' && github.event_name == 'pull_request' &&
          github.event.pull_request.number == 16
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.derived_visuals_upload.outputs.artifact-id }}
          ARCHIVE_SHA256: ${{ steps.derived_visuals.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_ID}"
          test -n "${ARCHIVE_SHA256}"
          echo "::error title=Derived visual review required::The audited 15-file candidate is preserved as artifact ${ARTIFACT_ID}; adopt only its byte-different files in a separate reviewed Omar-authored commit."
          exit 1

      - name: Reproduce recorded Pilot CLI receipt
        if:
          matrix.node == '22.23.1' && (github.event_name != 'pull_request' ||
          github.event.pull_request.number != 16)
        shell: bash
        run: |
          set -euo pipefail
          stdout="${RUNNER_TEMP}/pilot-evidence-check.stdout"
          stderr="${RUNNER_TEMP}/pilot-evidence-check.stderr"
          npm run --silent evidence:pilot:check >"${stdout}" 2>"${stderr}"
          test ! -s "${stderr}"
          cmp docs/quality/pilot-evidence-check.stdout "${stdout}"

      - name: Verify committed workflow GIF
        if:
          matrix.node == '22.23.1' && (github.event_name != 'pull_request' ||
          github.event.pull_request.number != 16)
        run: node tools/render-pilot-workflow-gif.mjs check

      - name: Verify README visuals
        if:
          matrix.node == '22.23.1' && (github.event_name != 'pull_request' ||
          github.event.pull_request.number != 16)
        run: node tools/render-readme-visuals.mjs check

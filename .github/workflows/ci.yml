name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.1", "24"]

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Source-bound evidence must resolve its recorded capture ancestors.
          fetch-depth: 0
          persist-credentials: false

      - name: Require the immutable event revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse --verify 'HEAD^{commit}')"
          test "${actual_revision}" = "${EXPECTED_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify formatting
        run: npm run format:check

      - name: Type-check
        run: npm run check

      - name: Enforce coverage floors
        if: matrix.node == '22.23.1'
        run: npm run coverage:check

      - name: Test current Node.js
        if: matrix.node == '24'
        run: npm test

      - name: Capture and audit a complete Pilot evidence candidate
        if: matrix.node == '22.23.1' && github.event_name == 'pull_request' && github.event.pull_request.number == 16
        id: pilot_bundle
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          candidate_root="${RUNNER_TEMP}/pilot-evidence-bundle-candidate"
          bundle="${candidate_root}/docs/images/pilot-portfolio-evidence"
          quality="${RUNNER_TEMP}/pilot-evidence-candidate-quality"
          archive="${RUNNER_TEMP}/pilot-evidence-bundle-candidate.zip"
          capture_receipt="${quality}/capture.stdout"
          capture_stderr="${quality}/capture.stderr"
          verify_receipt="${quality}/check.stdout"
          verify_stderr="${quality}/check.stderr"

          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_REVISION}"
          rm -rf -- "${candidate_root}" "${quality}"
          rm -f -- "${archive}"
          install -d -m 0700 -- "$(dirname "${bundle}")" "${quality}"
          if ! npm run --silent evidence:pilot -- capture --repository "${GITHUB_WORKSPACE}" --output "${bundle}" >"${capture_receipt}" 2>"${capture_stderr}"; then
            while IFS= read -r line; do
              printf '%s\n' "${line}" >&2
            done <"${capture_stderr}"
            exit 1
          fi
          test ! -s "${capture_stderr}"

          if ! npm run --silent evidence:pilot -- check --repository "${GITHUB_WORKSPACE}" --output "${bundle}" >"${verify_receipt}" 2>"${verify_stderr}"; then
            while IFS= read -r line; do
              printf '%s\n' "${line}" >&2
            done <"${verify_stderr}"
            exit 1
          fi
          test ! -s "${verify_stderr}"
          cmp -- "${capture_receipt}" "${verify_receipt}"

          CANDIDATE_ROOT="${candidate_root}" ARCHIVE="${archive}" EXPECTED_REVISION="${EXPECTED_REVISION}" SOURCE_ROOT="${GITHUB_WORKSPACE}" VERIFY_RECEIPT="${verify_receipt}" python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath

          maximum_bundle_bytes = 32 * 1024 * 1024
          maximum_file_bytes = 4 * 1024 * 1024

          def fail(message: str) -> None:
              raise SystemExit(message)

          def sha256(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()

          def git(source: Path, arguments: list[str]) -> str:
              result = subprocess.run(
                  ["git", *arguments],
                  cwd=source,
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              value = result.stdout.strip()
              if "\n" in value or "\r" in value:
                  fail("Git identity output is not one line")
              return value

          def read_regular(path: Path, maximum_bytes: int) -> bytes:
              flags = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0)
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags)
              try:
                  before = os.fstat(descriptor)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1:
                      fail(f"candidate member is not one owned regular file: {path.name}")
                  if before.st_size < 0 or before.st_size > maximum_bytes:
                      fail(f"candidate member exceeds its byte bound: {path.name}")
                  chunks: list[bytes] = []
                  remaining = before.st_size
                  while remaining:
                      chunk = os.read(descriptor, min(remaining, 1024 * 1024))
                      if not chunk:
                          fail(f"candidate member changed while reading: {path.name}")
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  if os.read(descriptor, 1):
                      fail(f"candidate member grew while reading: {path.name}")
                  after = os.fstat(descriptor)
                  identity_before = (
                      before.st_dev,
                      before.st_ino,
                      before.st_size,
                      before.st_mtime_ns,
                  )
                  identity_after = (
                      after.st_dev,
                      after.st_ino,
                      after.st_size,
                      after.st_mtime_ns,
                  )
                  if identity_before != identity_after:
                      fail(f"candidate member changed while reading: {path.name}")
                  return b"".join(chunks)
              finally:
                  os.close(descriptor)

          source = Path(os.environ["SOURCE_ROOT"]).resolve(strict=True)
          candidate_root = Path(os.environ["CANDIDATE_ROOT"]).resolve(strict=True)
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          archive = Path(os.environ["ARCHIVE"])
          receipt_path = Path(os.environ["VERIFY_RECEIPT"]).resolve(strict=True)
          expected_revision = os.environ["EXPECTED_REVISION"]

          if not re.fullmatch(r"[0-9a-f]{40}", expected_revision):
              fail("expected revision is not a full Git object identity")
          if runner_temp not in candidate_root.parents or runner_temp not in archive.parents:
              fail("candidate paths escaped the runner temporary directory")
          if (
              source == candidate_root
              or source in candidate_root.parents
              or candidate_root in source.parents
          ):
              fail("candidate path overlaps the source checkout")
          if archive.exists() or archive.is_symlink():
              fail("candidate archive output was not absent")

          bundle = candidate_root / "docs/images/pilot-portfolio-evidence"
          for directory in (
              candidate_root,
              candidate_root / "docs",
              candidate_root / "docs/images",
              bundle,
          ):
              identity = os.lstat(directory)
              if not stat.S_ISDIR(identity.st_mode) or stat.S_ISLNK(identity.st_mode):
                  fail("candidate directory topology is not closed")

          manifest_bytes = read_regular(bundle / "MANIFEST.json", 131_072)
          try:
              manifest = json.loads(manifest_bytes)
              fixtures = manifest["fixtures"]
              capture_spec_file = manifest["runtime"]["capture_spec_file"]
          except (KeyError, TypeError, json.JSONDecodeError) as error:
              fail(f"candidate manifest shape is invalid: {type(error).__name__}")

          names: set[str] = {"MANIFEST.json"}

          def add_name(value: object) -> None:
              if (
                  not isinstance(value, str)
                  or value in names
                  or value in {".", ".."}
                  or "/" in value
                  or "\\" in value
                  or "\x00" in value
              ):
                  fail("candidate manifest contains an unsafe or duplicate file identity")
              names.add(value)

          add_name(capture_spec_file)
          if not isinstance(fixtures, list) or len(fixtures) != 2:
              fail("candidate manifest fixture cardinality is not closed")
          for fixture in fixtures:
              if not isinstance(fixture, dict):
                  fail("candidate manifest fixture is not an object")
              add_name(fixture["fixture_manifest"]["file"])
              add_name(fixture["source_state"]["file"])
              workflows = fixture["workflows"]
              if not isinstance(workflows, list) or len(workflows) != 2:
                  fail("candidate manifest workflow cardinality is not closed")
              for workflow in workflows:
                  add_name(workflow["action_plan"]["file"])
                  add_name(workflow["workflow_audit"]["file"])
                  checkpoints = workflow["checkpoints"]
                  if not isinstance(checkpoints, list) or len(checkpoints) != 3:
                      fail("candidate manifest checkpoint cardinality is not closed")
                  for checkpoint in checkpoints:
                      add_name(checkpoint["screenshot"]["file"])
                      add_name(checkpoint["accessibility_tree"]["file"])
                      add_name(checkpoint["layout_graph"]["file"])

          if len(names) != 50:
              fail("candidate manifest does not identify exactly 50 bundle files")
          entries = sorted(os.scandir(bundle), key=lambda entry: entry.name)
          if [entry.name for entry in entries] != sorted(names):
              fail("candidate bundle directory inventory is not exact")
          if any(not entry.is_file(follow_symlinks=False) for entry in entries):
              fail("candidate bundle contains a symlink or non-file")

          bytes_by_archive_name: dict[str, bytes] = {}
          total_bytes = 0
          for name in sorted(names):
              value = read_regular(bundle / name, maximum_file_bytes)
              archive_name = f"docs/images/pilot-portfolio-evidence/{name}"
              bytes_by_archive_name[archive_name] = value
              total_bytes += len(value)
          if total_bytes < 1 or total_bytes > maximum_bundle_bytes:
              fail("candidate bundle total size is outside its bound")

          revision = git(source, ["rev-parse", "--verify", "HEAD^{commit}"])
          tree = git(source, ["rev-parse", "--verify", "HEAD^{tree}"])
          if revision != expected_revision:
              fail("candidate source revision differs from the event head")
          source_identity = manifest.get("source")
          if (
              not isinstance(source_identity, dict)
              or source_identity.get("git_revision") != revision
              or source_identity.get("git_tree") != tree
          ):
              fail("candidate manifest is not bound to the exact event head")

          package_lock = read_regular(source / "package-lock.json", maximum_file_bytes)
          package_lock_identity = source_identity.get("root_files", {}).get("package_lock")
          if package_lock_identity != {
              "sha256": sha256(package_lock),
              "byte_length": len(package_lock),
          }:
              fail("candidate manifest is not bound to the current package lock")

          receipt_bytes = read_regular(receipt_path, 4_096)
          try:
              receipt = json.loads(receipt_bytes)
          except json.JSONDecodeError as error:
              fail(f"candidate receipt is not JSON: {error.msg}")
          expected_receipt = {
              "official": False,
              "manifest_sha256": sha256(manifest_bytes),
              "fixture_count": 2,
              "workflow_count": 4,
              "checkpoint_count": 12,
          }
          if receipt != expected_receipt:
              fail("candidate verification receipt differs from the manifest")
          if receipt_bytes != (
              json.dumps(expected_receipt, separators=(",", ":")).encode("utf-8") + b"\n"
          ):
              fail("candidate verification receipt is not canonical and path-free")

          committed_bundle = source / "docs/images/pilot-portfolio-evidence"
          changed_files: list[str] = []
          for name in sorted(names):
              committed = read_regular(committed_bundle / name, maximum_file_bytes)
              candidate = bytes_by_archive_name[
                  f"docs/images/pilot-portfolio-evidence/{name}"
              ]
              if sha256(committed) != sha256(candidate):
                  changed_files.append(name)
          if not changed_files:
              fail("candidate bundle does not differ from committed evidence")

          with zipfile.ZipFile(
              archive,
              mode="x",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
              allowZip64=False,
          ) as candidate_zip:
              for archive_name in sorted(bytes_by_archive_name):
                  info = zipfile.ZipInfo(archive_name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (stat.S_IFREG | 0o644) << 16
                  candidate_zip.writestr(
                      info,
                      bytes_by_archive_name[archive_name],
                      compress_type=zipfile.ZIP_DEFLATED,
                      compresslevel=9,
                  )

          expected_archive_names = sorted(bytes_by_archive_name)
          with zipfile.ZipFile(archive, mode="r", allowZip64=False) as candidate_zip:
              infos = candidate_zip.infolist()
              observed_names = [info.filename for info in infos]
              if (
                  len(infos) != 50
                  or len(set(observed_names)) != 50
                  or observed_names != expected_archive_names
              ):
                  fail("candidate ZIP inventory is not exact and ordered")
              if candidate_zip.comment != b"" or candidate_zip.testzip() is not None:
                  fail("candidate ZIP integrity audit failed")
              expanded_bytes = 0
              for info in infos:
                  path = PurePosixPath(info.filename)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or "\\" in info.filename
                      or "\x00" in info.filename
                      or info.is_dir()
                      or info.flag_bits & 0x1
                      or info.compress_type != zipfile.ZIP_DEFLATED
                      or info.extra != b""
                      or info.comment != b""
                  ):
                      fail("candidate ZIP contains an unsafe member")
                  mode = info.external_attr >> 16
                  if (
                      stat.S_IFMT(mode) != stat.S_IFREG
                      or stat.S_IMODE(mode) != 0o644
                  ):
                      fail("candidate ZIP member mode is not canonical")
                  expected_bytes = bytes_by_archive_name[info.filename]
                  if info.file_size != len(expected_bytes):
                      fail("candidate ZIP member size differs from its source")
                  archived_bytes = candidate_zip.read(info)
                  if sha256(archived_bytes) != sha256(expected_bytes):
                      fail("candidate ZIP member digest differs from its source")
                  expanded_bytes += info.file_size
              if expanded_bytes != total_bytes or expanded_bytes > maximum_bundle_bytes:
                  fail("candidate ZIP expanded size is outside its bound")

          archive_bytes = read_regular(archive, maximum_bundle_bytes)
          audit = {
              "archive_sha256": sha256(archive_bytes),
              "archive_bytes": len(archive_bytes),
              "expanded_bytes": total_bytes,
              "entry_count": len(expected_archive_names),
              "manifest_sha256": sha256(manifest_bytes),
              "receipt_sha256": sha256(receipt_bytes),
              "changed_files": changed_files,
              "source_revision": revision,
              "source_tree": tree,
          }
          print(json.dumps(audit, separators=(",", ":")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"archive_sha256={audit['archive_sha256']}\n")
              output.write(f"archive_bytes={audit['archive_bytes']}\n")
              output.write(f"entry_count={audit['entry_count']}\n")
              output.write(f"manifest_sha256={audit['manifest_sha256']}\n")
              output.write(f"changed_count={len(changed_files)}\n")
          PY

          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload the complete Pilot evidence candidate
        if: matrix.node == '22.23.1' && github.event_name == 'pull_request' && github.event.pull_request.number == 16
        id: pilot_bundle_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pilot-evidence-bundle-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot-evidence-bundle-candidate.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Stop before Pilot evidence adoption
        if: matrix.node == '22.23.1' && github.event_name == 'pull_request' && github.event.pull_request.number == 16
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.pilot_bundle_upload.outputs.artifact-id }}
          ARCHIVE_SHA256: ${{ steps.pilot_bundle.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_ID}"
          test -n "${ARCHIVE_SHA256}"
          echo "::error title=Pilot evidence review required::The audited 50-file candidate is preserved as artifact ${ARTIFACT_ID}; adopt it only in a separate reviewed Omar-authored commit."
          exit 1

      - name: Verify committed workflow GIF
        if: matrix.node == '22.23.1'
        run: node tools/render-pilot-workflow-gif.mjs check

      - name: Verify README visuals
        if: matrix.node == '22.23.1'
        run: node tools/render-readme-visuals.mjs check

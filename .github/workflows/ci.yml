name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.1", "24"]

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Source-bound evidence must resolve its recorded capture ancestors.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify formatting
        run: npm run format:check

      - name: Type-check
        run: npm run check

      - name: Enforce coverage floors
        if: matrix.node == '22.23.1'
        run: npm run coverage:check

      - name: Test current Node.js
        if: matrix.node == '24'
        run: npm test

      - name: Reproduce recorded Pilot CLI receipt
        if: matrix.node == '22.23.1'
        shell: bash
        run: |
          set -euo pipefail
          stdout="${RUNNER_TEMP}/pilot-evidence-check.stdout"
          stderr="${RUNNER_TEMP}/pilot-evidence-check.stderr"
          npm run --silent evidence:pilot:check >"${stdout}" 2>"${stderr}"
          test ! -s "${stderr}"
          cmp docs/quality/pilot-evidence-check.stdout "${stdout}"

      - name: Verify committed workflow GIF
        if: matrix.node == '22.23.1'
        run: node tools/render-pilot-workflow-gif.mjs check

      - name: Verify README visuals
        if: matrix.node == '22.23.1'
        run: node tools/render-readme-visuals.mjs check

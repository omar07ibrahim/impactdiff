name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.1", "24"]

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository:
            ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Source-bound evidence must resolve its recorded capture ancestors.
          fetch-depth: 0
          persist-credentials: false

      - name: Require the immutable event revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse --verify 'HEAD^{commit}')"
          test "${actual_revision}" = "${EXPECTED_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify formatting
        run: npm run format:check

      - name: Type-check
        run: npm run check

      - name: Enforce coverage floors
        if:
          matrix.node == '22.23.1' && (github.event_name != 'pull_request' ||
          github.event.pull_request.number != 16)
        run: npm run coverage:check

      - name: Test current Node.js
        if:
          matrix.node == '24' && (github.event_name != 'pull_request' ||
          github.event.pull_request.number != 16)
        run: npm test

      - name: Capture and audit the committed Pilot receipt candidate
        if:
          matrix.node == '22.23.1' && github.event_name == 'pull_request' &&
          github.event.pull_request.number == 16
        id: pilot_receipt
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          candidate_root="${RUNNER_TEMP}/pilot-evidence-receipt-candidate"
          quality="${candidate_root}/docs/quality"
          archive="${RUNNER_TEMP}/pilot-evidence-receipt-candidate.zip"
          stderr="${RUNNER_TEMP}/pilot-evidence-receipt-candidate.stderr"

          rm -rf -- "${candidate_root}"
          rm -f -- "${archive}" "${stderr}"
          install -d -m 0700 -- "${quality}"

          if ! npm run --silent evidence:pilot:check >"${quality}/pilot-evidence-check.stdout" 2>"${stderr}"; then
            while IFS= read -r line; do
              printf '%s\n' "${line}" >&2
            done <"${stderr}"
            exit 1
          fi
          test ! -s "${stderr}"

          CANDIDATE_ROOT="${candidate_root}" ARCHIVE="${archive}" EXPECTED_REVISION="${EXPECTED_REVISION}" SOURCE_ROOT="${GITHUB_WORKSPACE}" python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath

          source = Path(os.environ["SOURCE_ROOT"]).resolve(strict=True)
          candidate = Path(os.environ["CANDIDATE_ROOT"]).resolve(strict=True)
          archive = Path(os.environ["ARCHIVE"])
          expected_revision = os.environ["EXPECTED_REVISION"]
          inputs = [
              ".node-version",
              "package.json",
              "package-lock.json",
              "tsconfig.json",
              "src/cli/pilot-portfolio-evidence.ts",
              "src/portfolio-evidence/publication.ts",
              "docs/images/pilot-portfolio-evidence/MANIFEST.json",
          ]

          def fail(message):
              raise SystemExit(message)

          def digest(value):
              return hashlib.sha256(value).hexdigest()

          def one_line(arguments):
              result = subprocess.run(
                  arguments,
                  cwd=source,
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if result.stderr or not result.stdout.endswith(b"\n"):
                  fail("candidate command output is not one clean line")
              value = result.stdout[:-1]
              if b"\n" in value or b"\x00" in value:
                  fail("candidate command output is not one clean line")
              return value.decode("utf-8")

          def read_source(relative):
              path = source / relative
              identity = path.lstat()
              if (
                  not stat.S_ISREG(identity.st_mode)
                  or identity.st_nlink != 1
                  or identity.st_size < 1
                  or identity.st_size > 4 * 1024 * 1024
              ):
                  fail("candidate input is not one bounded regular file")
              value = path.read_bytes()
              after = path.lstat()
              if (
                  len(value) != identity.st_size
                  or (identity.st_dev, identity.st_ino, identity.st_size, identity.st_mtime_ns)
                  != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns)
              ):
                  fail("candidate input changed while reading")
              return value

          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          if (
              not re.fullmatch(r"[0-9a-f]{40}", expected_revision)
              or runner_temp not in candidate.parents
              or runner_temp not in archive.parents
              or source == candidate
              or source in candidate.parents
              or candidate in source.parents
              or archive.exists()
              or archive.is_symlink()
          ):
              fail("candidate path or revision boundary is invalid")

          revision = one_line(["git", "rev-parse", "--verify", "HEAD^{commit}"])
          tree = one_line(["git", "rev-parse", "--verify", "HEAD^{tree}"])
          if revision != expected_revision:
              fail("candidate revision differs from the event revision")
          status = subprocess.run(
              ["git", "status", "--porcelain=v1", "-z", "--untracked-files=all"],
              cwd=source,
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          )
          if status.stderr or status.stdout:
              fail("candidate source checkout is not clean")

          stdout_path = candidate / "docs/quality/pilot-evidence-check.stdout"
          stdout = stdout_path.read_bytes()
          manifest = read_source("docs/images/pilot-portfolio-evidence/MANIFEST.json")
          expected_receipt = {
              "official": False,
              "manifest_sha256": digest(manifest),
              "fixture_count": 2,
              "workflow_count": 4,
              "checkpoint_count": 12,
          }
          canonical_receipt = (
              json.dumps(expected_receipt, separators=(",", ":")).encode() + b"\n"
          )
          if stdout != canonical_receipt:
              fail("candidate receipt differs from the committed manifest")

          node = one_line(["node", "--version"])
          runtime = {
              "node": node[1:] if node.startswith("v") else node,
              "node_module_abi": one_line(["node", "-p", "process.versions.modules"]),
              "npm": one_line(["npm", "--version"]),
              "platform": one_line(["node", "-p", "process.platform"]),
              "architecture": one_line(["node", "-p", "process.arch"]),
          }
          if runtime != {
              "node": "22.23.1",
              "node_module_abi": "127",
              "npm": "10.9.8",
              "platform": "linux",
              "architecture": "x64",
          }:
              fail("candidate runtime differs from the closed contract")

          input_records = []
          for relative in inputs:
              value = read_source(relative)
              input_records.append(
                  {
                      "path": relative,
                      "sha256": digest(value),
                      "byte_length": len(value),
                  }
              )

          run_record = {
              "contract": "impactdiff.pilot-evidence-cli-run",
              "version": 1,
              "official": False,
              "source": {"git_revision": revision, "git_tree": tree},
              "command": {
                  "argv": ["npm", "run", "--silent", "evidence:pilot:check"]
              },
              "runtime": runtime,
              "result": {
                  "exit_code": 0,
                  "stdout": {
                      "file": "pilot-evidence-check.stdout",
                      "media_type": "application/jsonl; charset=utf-8",
                      "sha256": digest(stdout),
                      "byte_length": len(stdout),
                      "line_count": 1,
                  },
                  "stderr": {
                      "sha256": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
                      "byte_length": 0,
                  },
              },
              "inputs": input_records,
              "evidence_boundary": {
                  "establishes": [
                      "one successful exact-runtime verification of the committed local-authoring Pilot evidence",
                      "path-free stdout exactly matches the independently derived committed-manifest receipt",
                      "the allowlisted source and manifest inputs have the recorded byte identities",
                  ],
                  "does_not_establish": [
                      "official dataset release",
                      "model quality or benchmark performance",
                      "fresh browser capture or production-browser compatibility",
                      "execution on any runtime other than the recorded Node.js 22.23.1",
                  ],
              },
          }
          run_bytes = json.dumps(run_record, indent=2).encode() + b"\n"
          run_path = candidate / "docs/quality/pilot-evidence-check-run.json"
          descriptor = os.open(
              run_path,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_CLOEXEC", 0),
              0o600,
          )
          try:
              if os.write(descriptor, run_bytes) != len(run_bytes):
                  fail("candidate run record write was incomplete")
              os.fsync(descriptor)
          finally:
              os.close(descriptor)
          os.chmod(stdout_path, 0o600)

          files = {
              "docs/quality/pilot-evidence-check-run.json": run_bytes,
              "docs/quality/pilot-evidence-check.stdout": stdout,
          }
          with zipfile.ZipFile(
              archive,
              mode="x",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
              allowZip64=False,
          ) as output:
              for name in sorted(files):
                  info = zipfile.ZipInfo(name, (1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (stat.S_IFREG | 0o644) << 16
                  output.writestr(info, files[name], compresslevel=9)

          with zipfile.ZipFile(archive, "r", allowZip64=False) as output:
              infos = output.infolist()
              if (
                  [info.filename for info in infos] != sorted(files)
                  or len(infos) != 2
                  or output.comment
                  or output.testzip() is not None
              ):
                  fail("candidate archive inventory is invalid")
              for info in infos:
                  path = PurePosixPath(info.filename)
                  mode = info.external_attr >> 16
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or info.is_dir()
                      or info.flag_bits & 1
                      or info.extra
                      or info.comment
                      or stat.S_IFMT(mode) != stat.S_IFREG
                      or stat.S_IMODE(mode) != 0o644
                      or output.read(info) != files[info.filename]
                  ):
                      fail("candidate archive member is unsafe or inexact")

          archive_bytes = archive.read_bytes()
          audit = {
              "archive_sha256": digest(archive_bytes),
              "archive_bytes": len(archive_bytes),
              "expanded_bytes": sum(map(len, files.values())),
              "entry_count": 2,
              "receipt_sha256": digest(stdout),
              "run_record_sha256": digest(run_bytes),
              "source_revision": revision,
              "source_tree": tree,
              "inputs": input_records,
          }
          print(json.dumps(audit, separators=(",", ":")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key in (
                  "archive_sha256",
                  "archive_bytes",
                  "receipt_sha256",
                  "run_record_sha256",
              ):
                  output.write(f"{key}={audit[key]}\n")
          PY

          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload the committed Pilot receipt candidate
        if:
          matrix.node == '22.23.1' && github.event_name == 'pull_request' &&
          github.event.pull_request.number == 16
        id: pilot_receipt_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pilot-evidence-receipt-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot-evidence-receipt-candidate.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Stop before Pilot receipt adoption
        if:
          matrix.node == '22.23.1' && github.event_name == 'pull_request' &&
          github.event.pull_request.number == 16
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.pilot_receipt_upload.outputs.artifact-id }}
          ARCHIVE_SHA256: ${{ steps.pilot_receipt.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_ID}"
          test -n "${ARCHIVE_SHA256}"
          echo "::error title=Pilot receipt review required::The audited two-file receipt candidate is preserved as artifact ${ARTIFACT_ID}; adopt it only in a separate reviewed Omar-authored commit."
          exit 1

      - name: Reproduce recorded Pilot CLI receipt
        if:
          matrix.node == '22.23.1' && (github.event_name != 'pull_request' ||
          github.event.pull_request.number != 16)
        shell: bash
        run: |
          set -euo pipefail
          stdout="${RUNNER_TEMP}/pilot-evidence-check.stdout"
          stderr="${RUNNER_TEMP}/pilot-evidence-check.stderr"
          npm run --silent evidence:pilot:check >"${stdout}" 2>"${stderr}"
          test ! -s "${stderr}"
          cmp docs/quality/pilot-evidence-check.stdout "${stdout}"

      - name: Verify committed workflow GIF
        if:
          matrix.node == '22.23.1' && (github.event_name != 'pull_request' ||
          github.event.pull_request.number != 16)
        run: node tools/render-pilot-workflow-gif.mjs check

      - name: Verify README visuals
        if:
          matrix.node == '22.23.1' && (github.event_name != 'pull_request' ||
          github.event.pull_request.number != 16)
        run: node tools/render-readme-visuals.mjs check

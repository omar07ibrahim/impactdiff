name: Pilot portfolio evidence staging

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pilot-portfolio-evidence-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    if: github.event.pull_request.number == 17
    name: Node 22.23.1 core candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the immutable PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the immutable event revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify formatting
        run: npm run format:check

      - name: Type-check
        run: npm run check

      - name: Generate and audit the core Pilot evidence candidate
        id: core_evidence
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          candidate_root="${RUNNER_TEMP}/pilot-portfolio-evidence-candidate"
          bundle="${candidate_root}/docs/images/pilot-portfolio-evidence"
          archive="${RUNNER_TEMP}/pilot-portfolio-evidence-candidate.zip"
          verification_root="${RUNNER_TEMP}/pilot-portfolio-evidence-verification"
          rm -rf -- "${candidate_root}" "${verification_root}"
          rm -f -- "${archive}"
          install -d -m 0700 -- "${candidate_root}/docs/images"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          npm run build
          capture_receipt="$(node dist/src/cli/pilot-portfolio-evidence.js capture --repository . --output "${bundle}")"
          check_receipt="$(node dist/src/cli/pilot-portfolio-evidence.js check --repository . --output "${bundle}")"
          test -n "${capture_receipt}"
          test "${capture_receipt}" = "${check_receipt}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git clone --quiet --no-local --no-checkout -- "${GITHUB_WORKSPACE}" "${verification_root}"
          git -C "${verification_root}" checkout --quiet --detach "${EXPECTED_REVISION}"
          test "$(git -C "${verification_root}" rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_REVISION}"
          test -z "$(git -C "${verification_root}" status --porcelain=v1 --untracked-files=all)"
          rm -rf -- "${verification_root}/docs/images/pilot-portfolio-evidence"
          install -d -m 0700 -- "${verification_root}/docs/images/pilot-portfolio-evidence"
          cp -a "${bundle}/." "${verification_root}/docs/images/pilot-portfolio-evidence/"
          git -C "${verification_root}" add -- docs/images/pilot-portfolio-evidence
          test -n "$(git -C "${verification_root}" diff --cached --name-only)"
          while IFS= read -r path; do
            case "${path}" in
              docs/images/pilot-portfolio-evidence/*) ;;
              *) exit 1 ;;
            esac
          done < <(git -C "${verification_root}" diff --cached --name-only)
          git -C "${verification_root}" \
            -c user.name="Omar Ibrahim" \
            -c user.email="31526072+omar07ibrahim@users.noreply.github.com" \
            commit --quiet --no-gpg-sign --no-verify \
            -m "Verify core Pilot evidence candidate"
          verification_revision="$(git -C "${verification_root}" rev-parse --verify 'HEAD^{commit}')"
          test "$(git -C "${verification_root}" rev-parse --verify 'HEAD^1')" = "${EXPECTED_REVISION}"
          test -z "$(git -C "${verification_root}" status --porcelain=v1 --untracked-files=all)"

          (
            cd "${verification_root}"
            npm ci
            npm run format:check
            npm run check
            npm run build
            node dist/src/cli/pilot-portfolio-evidence.js check \
              --repository . \
              --output docs/images/pilot-portfolio-evidence
          )
          test -z "$(git -C "${verification_root}" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          env \
            CANDIDATE_ROOT="${candidate_root}" \
            ARCHIVE="${archive}" \
            EXPECTED_REVISION="${EXPECTED_REVISION}" \
            SOURCE_ROOT="${GITHUB_WORKSPACE}" \
            VERIFICATION_ROOT="${verification_root}" \
            VERIFICATION_REVISION="${verification_revision}" \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 - <<'PY'
          import binascii
          import hashlib
          import json
          import os
          import re
          import stat
          import struct
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath

          prefix = "docs/images/pilot-portfolio-evidence/"
          source = Path(os.environ["SOURCE_ROOT"]).resolve(strict=True)
          candidate_root = Path(os.environ["CANDIDATE_ROOT"]).resolve(strict=True)
          candidate = (candidate_root / prefix.removesuffix("/")).resolve(strict=True)
          verification = Path(os.environ["VERIFICATION_ROOT"]).resolve(strict=True)
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          archive = Path(os.environ["ARCHIVE"])
          revision = os.environ["EXPECTED_REVISION"]
          verification_revision = os.environ["VERIFICATION_REVISION"]

          def fail(message):
              raise SystemExit(message)

          def git(root, arguments):
              result = subprocess.run(
                  ["/usr/bin/git", "-C", str(root), *arguments],
                  check=False,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  env={
                      "PATH": "/usr/bin:/bin",
                      "LANG": "C",
                      "LC_ALL": "C",
                      "TZ": "UTC",
                  },
                  timeout=30,
              )
              if result.returncode != 0 or result.stderr:
                  fail("bounded git inspection failed")
              return result.stdout.decode("utf-8")

          def digest(value):
              return hashlib.sha256(value).hexdigest()

          def git_blob(value):
              header = f"blob {len(value)}".encode("ascii") + bytes([0])
              return hashlib.sha1(header + value).hexdigest()

          def no_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      fail("candidate JSON contains a duplicate key")
                  result[key] = value
              return result

          def read_regular(path, maximum):
              flags = os.O_RDONLY | os.O_NONBLOCK
              flags |= getattr(os, "O_CLOEXEC", 0)
              flags |= getattr(os, "O_NOFOLLOW", 0)
              descriptor = os.open(path, flags)
              try:
                  before = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(before.st_mode)
                      or stat.S_IMODE(before.st_mode) != 0o644
                      or before.st_uid != os.getuid()
                      or before.st_nlink != 1
                      or before.st_size < 1
                      or before.st_size > maximum
                  ):
                      fail("candidate member identity is outside its boundary")
                  chunks = []
                  remaining = before.st_size
                  while remaining:
                      chunk = os.read(descriptor, min(remaining, 131072))
                      if not chunk:
                          fail("candidate member ended early")
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  if os.read(descriptor, 1):
                      fail("candidate member exceeds its recorded size")
                  value = b"".join(chunks)
                  after = os.fstat(descriptor)
                  path_after = path.lstat()
                  before_state = (
                      before.st_dev,
                      before.st_ino,
                      before.st_mode,
                      before.st_uid,
                      before.st_gid,
                      before.st_nlink,
                      before.st_size,
                      before.st_mtime_ns,
                      before.st_ctime_ns,
                  )
                  after_state = (
                      after.st_dev,
                      after.st_ino,
                      after.st_mode,
                      after.st_uid,
                      after.st_gid,
                      after.st_nlink,
                      after.st_size,
                      after.st_mtime_ns,
                      after.st_ctime_ns,
                  )
                  path_state = (
                      path_after.st_dev,
                      path_after.st_ino,
                      path_after.st_mode,
                      path_after.st_uid,
                      path_after.st_gid,
                      path_after.st_nlink,
                      path_after.st_size,
                      path_after.st_mtime_ns,
                      path_after.st_ctime_ns,
                  )
                  if before_state != after_state or before_state != path_state:
                      fail("candidate member changed while reading")
                  return value
              finally:
                  os.close(descriptor)

          def audit_png(value):
              if value[:8] != b"\x89PNG\r\n\x1a\n":
                  fail("candidate PNG signature is invalid")
              offset = 8
              chunks = []
              while offset < len(value):
                  if offset + 12 > len(value):
                      fail("candidate PNG is truncated")
                  length = struct.unpack(">I", value[offset : offset + 4])[0]
                  kind = value[offset + 4 : offset + 8]
                  end = offset + 12 + length
                  if length > 8 * 1024 * 1024 or end > len(value):
                      fail("candidate PNG chunk is invalid")
                  data = value[offset + 8 : offset + 8 + length]
                  expected_crc = struct.unpack(">I", value[offset + 8 + length : end])[0]
                  if binascii.crc32(kind + data) & 0xFFFFFFFF != expected_crc:
                      fail("candidate PNG checksum is invalid")
                  chunks.append((kind, data))
                  offset = end
              if offset != len(value) or [kind for kind, _ in chunks] != [
                  b"IHDR",
                  b"IDAT",
                  b"IEND",
              ]:
                  fail("candidate PNG chunk inventory is invalid")
              if len(chunks[0][1]) != 13 or chunks[2][1]:
                  fail("candidate PNG structure is invalid")
              if struct.unpack(">IIBBBBB", chunks[0][1]) != (800, 600, 8, 6, 0, 0, 0):
                  fail("candidate PNG dimensions or encoding are invalid")

          if (
              candidate_root.parent != runner_temp
              or archive.parent.resolve(strict=True) != runner_temp
              or verification.parent != runner_temp
              or source == verification
              or source == candidate_root
          ):
              fail("candidate roots are outside the closed runner boundary")

          tree = git(source, ["rev-parse", "--verify", f"{revision}^{{tree}}"]).strip()
          if git(source, ["rev-parse", "--verify", "HEAD^{commit}"]).strip() != revision:
              fail("source revision changed")

          expected = sorted(
              line
              for line in git(
                  source,
                  ["ls-tree", "-r", "--name-only", revision, "--", prefix.removesuffix("/")],
              ).splitlines()
              if line
          )
          if (
              len(expected) != 50
              or len(set(expected)) != len(expected)
              or any(not path.startswith(prefix) for path in expected)
          ):
              fail("trusted evidence inventory is not the closed 50-file contract")

          observed = []
          values = {}
          for root, directories, filenames in os.walk(
              candidate,
              topdown=True,
              followlinks=False,
          ):
              directories.sort()
              filenames.sort()
              root_path = Path(root)
              for name in directories:
                  directory = root_path / name
                  identity = directory.lstat()
                  if (
                      not stat.S_ISDIR(identity.st_mode)
                      or identity.st_uid != os.getuid()
                      or stat.S_IMODE(identity.st_mode) & 0o022
                  ):
                      fail("candidate contains an unsafe directory")
              for name in filenames:
                  path = root_path / name
                  relative = prefix + path.relative_to(candidate).as_posix()
                  if relative.endswith(".json"):
                      maximum = 512 * 1024
                  elif relative.endswith(".png"):
                      maximum = 8 * 1024 * 1024
                  else:
                      fail("candidate contains an unexpected media type")
                  values[relative] = read_regular(path, maximum)
                  observed.append(relative)

          observed.sort()
          if observed != expected or sum(map(len, values.values())) > 8 * 1024 * 1024:
              fail("candidate inventory or expanded size is outside its boundary")

          sensitive = (
              re.compile(rb"AKIA[0-9A-Z]{16}"),
              re.compile(rb"gh[pousr]_[A-Za-z0-9_]{20,}"),
              re.compile(rb"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              re.compile(rb"(?i)authorization\s*:\s*bearer"),
              re.compile(rb"/home/runner/"),
              re.compile(rb"/github/workspace/"),
          )
          parsed_json = {}
          for name, value in values.items():
              if any(pattern.search(value) for pattern in sensitive):
                  fail("candidate contains a sensitive text pattern")
              if name.endswith(".json"):
                  try:
                      text = value.decode("utf-8")
                      parsed_json[name] = json.loads(
                          text,
                          object_pairs_hook=no_duplicate_keys,
                          parse_constant=lambda value: fail(
                              f"candidate JSON contains non-finite value {value}"
                          ),
                      )
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      fail("candidate JSON is invalid")
              else:
                  audit_png(value)

          manifest = parsed_json[prefix + "MANIFEST.json"]
          if (
              not isinstance(manifest, dict)
              or manifest.get("contract") != "impactdiff.pilot-portfolio-evidence"
              or manifest.get("version") != 1
              or manifest.get("official") is not False
              or manifest.get("source", {}).get("git_revision") != revision
              or manifest.get("source", {}).get("git_tree") != tree
          ):
              fail("candidate manifest provenance is not exact")

          verification_files = sorted(
              line
              for line in git(
                  verification,
                  [
                      "diff-tree",
                      "--no-commit-id",
                      "--name-only",
                      "-r",
                      verification_revision,
                  ],
              ).splitlines()
              if line
          )
          if (
              not verification_files
              or prefix + "MANIFEST.json" not in verification_files
              or any(path not in expected for path in verification_files)
          ):
              fail("verification commit scope is not the evidence bundle")

          identities = []
          changed = []
          for name in expected:
              value = values[name]
              blob = git_blob(value)
              committed = git(source, ["rev-parse", f"{revision}:{name}"]).strip()
              verified = git(
                  verification,
                  ["rev-parse", f"{verification_revision}:{name}"],
              ).strip()
              if verified != blob:
                  fail("verified commit bytes differ from the candidate")
              row = {
                  "path": name,
                  "sha256": digest(value),
                  "byte_length": len(value),
                  "git_blob": blob,
                  "current_blob": committed,
              }
              identities.append(row)
              if blob != committed:
                  changed.append(name)

          if changed != verification_files:
              fail("candidate change inventory differs from the verification commit")

          with zipfile.ZipFile(
              archive,
              mode="x",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
              allowZip64=False,
          ) as output:
              for name in expected:
                  info = zipfile.ZipInfo(name, (1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (stat.S_IFREG | 0o644) << 16
                  output.writestr(info, values[name], compresslevel=9)

          with zipfile.ZipFile(archive, "r", allowZip64=False) as output:
              infos = output.infolist()
              if (
                  [info.filename for info in infos] != expected
                  or len(infos) != 50
                  or output.comment
                  or output.testzip() is not None
              ):
                  fail("candidate archive inventory or integrity is invalid")
              for info in infos:
                  path = PurePosixPath(info.filename)
                  mode = info.external_attr >> 16
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or info.is_dir()
                      or info.flag_bits & 1
                      or info.extra
                      or info.comment
                      or stat.S_IFMT(mode) != stat.S_IFREG
                      or stat.S_IMODE(mode) != 0o644
                      or output.read(info) != values[info.filename]
                  ):
                      fail("candidate archive member is unsafe or inexact")

          archive_bytes = archive.read_bytes()
          audit = {
              "archive_sha256": digest(archive_bytes),
              "archive_bytes": len(archive_bytes),
              "expanded_bytes": sum(map(len, values.values())),
              "entry_count": len(expected),
              "changed_files": changed,
              "source_revision": revision,
              "source_tree": tree,
              "verification_revision": verification_revision,
              "verification_files": verification_files,
              "files": identities,
          }
          print(json.dumps(audit, separators=(",", ":")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"archive_sha256={audit['archive_sha256']}\n")
              output.write(f"archive_bytes={audit['archive_bytes']}\n")
              output.write(f"entry_count={audit['entry_count']}\n")
              output.write(f"changed_count={len(changed)}\n")
          PY

          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload the core Pilot evidence candidate
        id: core_evidence_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pilot-portfolio-evidence-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot-portfolio-evidence-candidate.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Stop before core Pilot evidence adoption
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.core_evidence_upload.outputs.artifact-id }}
          ARCHIVE_SHA256: ${{ steps.core_evidence.outputs.archive_sha256 }}
          CHANGED_COUNT: ${{ steps.core_evidence.outputs.changed_count }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_ID}"
          test -n "${ARCHIVE_SHA256}"
          test "${CHANGED_COUNT}" -gt 0
          echo "::error title=Core Pilot evidence review required::The audited 50-file candidate is preserved as artifact ${ARTIFACT_ID}; adopt only its byte-different files in a separate reviewed Omar-authored commit."
          exit 1

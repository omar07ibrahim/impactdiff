name: Pilot CLI receipt staging

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pilot-cli-receipt-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    if: github.event.pull_request.number == 17
    name: Node 22.23.1 receipt candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the immutable PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the immutable event revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify formatting
        run: npm run format:check

      - name: Type-check
        run: npm run check

      - name: Generate and audit the CLI receipt candidate
        id: cli_receipt
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          candidate_root="${RUNNER_TEMP}/pilot-cli-receipt-candidate"
          archive="${RUNNER_TEMP}/pilot-cli-receipt-candidate.zip"
          verification_root="${RUNNER_TEMP}/pilot-cli-receipt-verification"
          rm -rf -- "${candidate_root}" "${verification_root}"
          rm -f -- "${archive}"
          install -d -m 0700 -- "${candidate_root}/docs/quality"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          env \
            CANDIDATE_ROOT="${candidate_root}" \
            EXPECTED_REVISION="${EXPECTED_REVISION}" \
            SOURCE_ROOT="${GITHUB_WORKSPACE}" \
            node --input-type=module - <<'NODE'
          import { createHash } from "node:crypto";
          import { spawnSync } from "node:child_process";
          import { chmod, readFile, realpath, writeFile } from "node:fs/promises";
          import { resolve } from "node:path";

          const inputPaths = [
            ".node-version",
            "package.json",
            "package-lock.json",
            "tsconfig.json",
            "src/cli/pilot-portfolio-evidence.ts",
            "src/portfolio-evidence/publication.ts",
            "docs/images/pilot-portfolio-evidence/MANIFEST.json",
          ];
          const commandArgv = ["npm", "run", "--silent", "evidence:pilot:check"];
          const establishes = [
            "one successful exact-runtime verification of the committed local-authoring Pilot evidence",
            "path-free stdout exactly matches the independently derived committed-manifest receipt",
            "the allowlisted source and manifest inputs have the recorded byte identities",
          ];
          const doesNotEstablish = [
            "official dataset release",
            "model quality or benchmark performance",
            "fresh browser capture or production-browser compatibility",
            "execution on any runtime other than the recorded Node.js 22.23.1",
          ];
          const expectedRevision = process.env.EXPECTED_REVISION;
          const sourceRoot = await realpath(process.env.SOURCE_ROOT);
          const candidateRoot = await realpath(process.env.CANDIDATE_ROOT);

          function fail(message) {
            throw new Error(message);
          }

          function sha256(value) {
            return createHash("sha256").update(value).digest("hex");
          }

          function safeEnvironment() {
            const path = process.env.PATH;
            if (typeof path !== "string" || path.length < 1 || path.includes("\0")) {
              fail("invalid PATH");
            }
            return {
              PATH: path,
              CI: "1",
              FORCE_COLOR: "0",
              NO_COLOR: "1",
              LANG: "C",
              LC_ALL: "C",
              TZ: "UTC",
              npm_config_audit: "false",
              npm_config_fund: "false",
              npm_config_update_notifier: "false",
            };
          }

          function run(executable, arguments_, maximumBytes, encoding = "buffer") {
            const result = spawnSync(executable, arguments_, {
              cwd: sourceRoot,
              env: safeEnvironment(),
              shell: false,
              encoding,
              maxBuffer: maximumBytes,
              timeout: 120_000,
              windowsHide: true,
            });
            if (
              result.error !== undefined ||
              result.signal !== null ||
              result.status === null
            ) {
              fail("bounded command failed");
            }
            return result;
          }

          function gitLine(arguments_) {
            const result = run("/usr/bin/git", arguments_, 64 * 1024, "utf8");
            if (
              result.status !== 0 ||
              result.stderr !== "" ||
              typeof result.stdout !== "string" ||
              !result.stdout.endsWith("\n") ||
              result.stdout.slice(0, -1).includes("\n") ||
              result.stdout.includes("\0")
            ) {
              fail("git inspection failed");
            }
            return result.stdout.slice(0, -1);
          }

          if (
            process.platform !== "linux" ||
            process.arch !== "x64" ||
            process.versions.node !== "22.23.1" ||
            process.versions.modules !== "127" ||
            typeof expectedRevision !== "string" ||
            !/^[0-9a-f]{40}$/u.test(expectedRevision) ||
            gitLine(["rev-parse", "--show-toplevel"]) !== sourceRoot ||
            gitLine(["rev-parse", "--verify", "HEAD^{commit}"]) !== expectedRevision
          ) {
            fail("runtime or revision mismatch");
          }
          const sourceTree = gitLine(["rev-parse", "--verify", "HEAD^{tree}"]);
          const status = run(
            "/usr/bin/git",
            ["status", "--porcelain=v1", "--untracked-files=all"],
            64 * 1024,
          );
          if (
            status.status !== 0 ||
            status.stderr.byteLength !== 0 ||
            status.stdout.byteLength !== 0
          ) {
            fail("source repository is dirty");
          }

          const sourceBytes = new Map();
          for (const path of inputPaths) {
            const bytes = await readFile(resolve(sourceRoot, path));
            if (!Buffer.isBuffer(bytes) || bytes.byteLength < 1) {
              fail("source input is empty");
            }
            sourceBytes.set(path, bytes);
          }

          const npmVersion = run("npm", ["--version"], 256);
          if (
            npmVersion.status !== 0 ||
            npmVersion.stderr.byteLength !== 0 ||
            npmVersion.stdout.toString("utf8") !== "10.9.8\n"
          ) {
            fail("npm runtime mismatch");
          }
          const command = run(commandArgv[0], commandArgv.slice(1), 4 * 1024);
          if (
            command.status !== 0 ||
            command.stderr.byteLength !== 0 ||
            command.stdout.byteLength < 2 ||
            command.stdout.at(-1) !== 0x0a ||
            command.stdout.subarray(0, -1).includes(0x0a) ||
            command.stdout.includes(0x00)
          ) {
            fail("CLI capture failed");
          }
          if (
            gitLine(["rev-parse", "--verify", "HEAD^{commit}"]) !== expectedRevision ||
            gitLine(["rev-parse", "--verify", "HEAD^{tree}"]) !== sourceTree
          ) {
            fail("source revision changed during capture");
          }
          for (const path of inputPaths) {
            const after = await readFile(resolve(sourceRoot, path));
            if (!sourceBytes.get(path).equals(after)) {
              fail("source input changed during capture");
            }
          }

          const receiptText = command.stdout.subarray(0, -1).toString("utf8");
          const receipt = JSON.parse(receiptText);
          const receiptKeys = [
            "official",
            "manifest_sha256",
            "fixture_count",
            "workflow_count",
            "checkpoint_count",
          ];
          if (
            typeof receipt !== "object" ||
            receipt === null ||
            Array.isArray(receipt) ||
            Object.keys(receipt).length !== receiptKeys.length ||
            Object.keys(receipt).some((key, index) => key !== receiptKeys[index]) ||
            JSON.stringify(receipt) !== receiptText ||
            receipt.official !== false ||
            !/^[0-9a-f]{64}$/u.test(receipt.manifest_sha256) ||
            receipt.fixture_count !== 2 ||
            receipt.workflow_count !== 4 ||
            receipt.checkpoint_count !== 12
          ) {
            fail("CLI receipt is not canonical");
          }
          const manifestBytes = sourceBytes.get(
            "docs/images/pilot-portfolio-evidence/MANIFEST.json",
          );
          if (sha256(manifestBytes) !== receipt.manifest_sha256) {
            fail("CLI receipt does not bind the manifest");
          }

          const inputs = inputPaths.map((path) => {
            const bytes = sourceBytes.get(path);
            return {
              path,
              sha256: sha256(bytes),
              byte_length: bytes.byteLength,
            };
          });
          const record = {
            contract: "impactdiff.pilot-evidence-cli-run",
            version: 1,
            official: false,
            source: {
              git_revision: expectedRevision,
              git_tree: sourceTree,
            },
            command: {
              argv: commandArgv,
            },
            runtime: {
              node: process.versions.node,
              node_module_abi: process.versions.modules,
              npm: "10.9.8",
              platform: process.platform,
              architecture: process.arch,
            },
            result: {
              exit_code: 0,
              stdout: {
                file: "pilot-evidence-check.stdout",
                media_type: "application/jsonl; charset=utf-8",
                sha256: sha256(command.stdout),
                byte_length: command.stdout.byteLength,
                line_count: 1,
              },
              stderr: {
                sha256:
                  "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
                byte_length: 0,
              },
            },
            inputs,
            evidence_boundary: {
              establishes,
              does_not_establish: doesNotEstablish,
            },
          };
          const recordBytes = Buffer.from(
            JSON.stringify(record, null, 2) + "\n",
            "utf8",
          );
          const stdoutPath = resolve(
            candidateRoot,
            "docs/quality/pilot-evidence-check.stdout",
          );
          const recordPath = resolve(
            candidateRoot,
            "docs/quality/pilot-evidence-check-run.json",
          );
          await writeFile(stdoutPath, command.stdout, {
            flag: "wx",
            mode: 0o600,
          });
          await writeFile(recordPath, recordBytes, {
            flag: "wx",
            mode: 0o600,
          });
          await chmod(stdoutPath, 0o644);
          await chmod(recordPath, 0o644);
          process.stdout.write(
            JSON.stringify({
              source_revision: expectedRevision,
              source_tree: sourceTree,
              stdout_sha256: sha256(command.stdout),
              run_record_sha256: sha256(recordBytes),
            }) + "\n",
          );
          NODE

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git clone --quiet --no-local --no-checkout -- "${GITHUB_WORKSPACE}" "${verification_root}"
          git -C "${verification_root}" checkout --quiet --detach "${EXPECTED_REVISION}"
          test "$(git -C "${verification_root}" rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_REVISION}"
          cp -a "${candidate_root}/docs/quality/." "${verification_root}/docs/quality/"
          git -C "${verification_root}" add -- \
            docs/quality/pilot-evidence-check-run.json \
            docs/quality/pilot-evidence-check.stdout
          test "$(git -C "${verification_root}" diff --cached --name-only | wc -l)" -eq 2
          git -C "${verification_root}" \
            -c user.name="Omar Ibrahim" \
            -c user.email="31526072+omar07ibrahim@users.noreply.github.com" \
            commit --quiet --no-gpg-sign --no-verify \
            -m "Verify Pilot CLI receipt candidate"
          verification_revision="$(git -C "${verification_root}" rev-parse --verify 'HEAD^{commit}')"
          test "$(git -C "${verification_root}" rev-parse --verify 'HEAD^1')" = "${EXPECTED_REVISION}"
          test -z "$(git -C "${verification_root}" status --porcelain=v1 --untracked-files=all)"

          (
            cd "${verification_root}"
            npm ci
            npm run format:check
            npm run check
            npm run --silent evidence:pilot:check >"${RUNNER_TEMP}/verified-pilot-evidence-check.stdout"
            cmp docs/quality/pilot-evidence-check.stdout "${RUNNER_TEMP}/verified-pilot-evidence-check.stdout"
            node tools/capture-pilot-cli-terminal.mjs record
            node tools/capture-pilot-cli-terminal.mjs check
            git restore --source=HEAD --worktree -- docs/images/terminal-evidence
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          env \
            CANDIDATE_ROOT="${candidate_root}" \
            ARCHIVE="${archive}" \
            EXPECTED_REVISION="${EXPECTED_REVISION}" \
            SOURCE_ROOT="${GITHUB_WORKSPACE}" \
            VERIFICATION_ROOT="${verification_root}" \
            VERIFICATION_REVISION="${verification_revision}" \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath

          expected = [
              "docs/quality/pilot-evidence-check-run.json",
              "docs/quality/pilot-evidence-check.stdout",
          ]
          input_paths = [
              ".node-version",
              "package.json",
              "package-lock.json",
              "tsconfig.json",
              "src/cli/pilot-portfolio-evidence.ts",
              "src/portfolio-evidence/publication.ts",
              "docs/images/pilot-portfolio-evidence/MANIFEST.json",
          ]
          command_argv = ["npm", "run", "--silent", "evidence:pilot:check"]
          establishes = [
              "one successful exact-runtime verification of the committed local-authoring Pilot evidence",
              "path-free stdout exactly matches the independently derived committed-manifest receipt",
              "the allowlisted source and manifest inputs have the recorded byte identities",
          ]
          does_not_establish = [
              "official dataset release",
              "model quality or benchmark performance",
              "fresh browser capture or production-browser compatibility",
              "execution on any runtime other than the recorded Node.js 22.23.1",
          ]
          candidate_root = Path(os.environ["CANDIDATE_ROOT"]).resolve(strict=True)
          source = Path(os.environ["SOURCE_ROOT"]).resolve(strict=True)
          verification = Path(os.environ["VERIFICATION_ROOT"]).resolve(strict=True)
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          archive = Path(os.environ["ARCHIVE"])
          revision = os.environ["EXPECTED_REVISION"]
          verification_revision = os.environ["VERIFICATION_REVISION"]

          def fail(message):
              raise SystemExit(message)

          def digest(value):
              return hashlib.sha256(value).hexdigest()

          def git_blob(value):
              return hashlib.sha1(
                  f"blob {len(value)}".encode("ascii") + bytes([0]) + value
              ).hexdigest()

          def git(root, arguments):
              result = subprocess.run(
                  ["/usr/bin/git", "-C", str(root), *arguments],
                  check=False,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  env={
                      "PATH": "/usr/bin:/bin",
                      "LANG": "C",
                      "LC_ALL": "C",
                      "TZ": "UTC",
                  },
                  timeout=30,
              )
              if result.returncode != 0 or result.stderr:
                  fail("bounded git inspection failed")
              return result.stdout.decode("utf-8")

          def no_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      fail("candidate JSON contains a duplicate key")
                  result[key] = value
              return result

          def read_regular(path, maximum):
              descriptor = os.open(
                  path,
                  os.O_RDONLY
                  | os.O_NONBLOCK
                  | getattr(os, "O_CLOEXEC", 0)
                  | getattr(os, "O_NOFOLLOW", 0),
              )
              try:
                  before = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(before.st_mode)
                      or stat.S_IMODE(before.st_mode) != 0o644
                      or before.st_uid != os.getuid()
                      or before.st_nlink != 1
                      or before.st_size < 1
                      or before.st_size > maximum
                  ):
                      fail("candidate file identity is invalid")
                  chunks = []
                  remaining = before.st_size
                  while remaining:
                      chunk = os.read(descriptor, min(remaining, 131072))
                      if not chunk:
                          fail("candidate file ended early")
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  if os.read(descriptor, 1):
                      fail("candidate file exceeds its identity")
                  value = b"".join(chunks)
                  after = os.fstat(descriptor)
                  path_after = path.lstat()
                  state = lambda item: (
                      item.st_dev,
                      item.st_ino,
                      item.st_mode,
                      item.st_uid,
                      item.st_gid,
                      item.st_nlink,
                      item.st_size,
                      item.st_mtime_ns,
                      item.st_ctime_ns,
                  )
                  if state(before) != state(after) or state(before) != state(path_after):
                      fail("candidate file changed while reading")
                  return value
              finally:
                  os.close(descriptor)

          if (
              candidate_root.parent != runner_temp
              or archive.parent.resolve(strict=True) != runner_temp
              or verification.parent != runner_temp
              or source in (candidate_root, verification)
          ):
              fail("candidate roots are outside the runner boundary")

          observed = []
          for root, directories, filenames in os.walk(
              candidate_root,
              topdown=True,
              followlinks=False,
          ):
              directories.sort()
              filenames.sort()
              root_path = Path(root)
              for name in directories:
                  identity = (root_path / name).lstat()
                  if not stat.S_ISDIR(identity.st_mode):
                      fail("candidate contains a linked directory")
              for name in filenames:
                  observed.append(
                      (root_path / name).relative_to(candidate_root).as_posix()
                  )
          observed.sort()
          if observed != expected:
              fail("candidate inventory is not the closed two-file contract")

          values = {
              name: read_regular(candidate_root / name, 16 * 1024)
              for name in expected
          }
          sensitive = (
              re.compile(rb"AKIA[0-9A-Z]{16}"),
              re.compile(rb"gh[pousr]_[A-Za-z0-9_]{20,}"),
              re.compile(rb"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              re.compile(rb"(?i)authorization\s*:\s*bearer"),
              re.compile(rb"/home/runner/"),
              re.compile(rb"/github/workspace/"),
          )
          if any(
              pattern.search(value)
              for value in values.values()
              for pattern in sensitive
          ):
              fail("candidate contains a sensitive text pattern")

          stdout = values[expected[1]]
          if (
              stdout[-1:] != b"\n"
              or b"\n" in stdout[:-1]
              or b"\r" in stdout
              or b"\0" in stdout
          ):
              fail("candidate stdout shape is invalid")
          try:
              receipt = json.loads(
                  stdout[:-1].decode("utf-8"),
                  object_pairs_hook=no_duplicate_keys,
                  parse_constant=lambda value: fail(
                      f"candidate receipt contains non-finite value {value}"
                  ),
              )
              record = json.loads(
                  values[expected[0]].decode("utf-8"),
                  object_pairs_hook=no_duplicate_keys,
                  parse_constant=lambda value: fail(
                      f"candidate run record contains non-finite value {value}"
                  ),
              )
          except (UnicodeDecodeError, json.JSONDecodeError):
              fail("candidate JSON is invalid")

          if (
              list(receipt) != [
                  "official",
                  "manifest_sha256",
                  "fixture_count",
                  "workflow_count",
                  "checkpoint_count",
              ]
              or json.dumps(receipt, separators=(",", ":")).encode() + b"\n" != stdout
              or receipt.get("official") is not False
              or receipt.get("fixture_count") != 2
              or receipt.get("workflow_count") != 4
              or receipt.get("checkpoint_count") != 12
          ):
              fail("candidate receipt is not canonical")

          canonical_record = (
              json.dumps(record, indent=2, ensure_ascii=False, separators=(",", ": "))
              + "\n"
          ).encode("utf-8")
          if canonical_record != values[expected[0]]:
              fail("candidate run record is not canonical")

          tree = git(source, ["rev-parse", "--verify", f"{revision}^{{tree}}"]).strip()
          if (
              list(record) != [
                  "contract",
                  "version",
                  "official",
                  "source",
                  "command",
                  "runtime",
                  "result",
                  "inputs",
                  "evidence_boundary",
              ]
              or record.get("contract") != "impactdiff.pilot-evidence-cli-run"
              or record.get("version") != 1
              or record.get("official") is not False
              or record.get("source")
              != {"git_revision": revision, "git_tree": tree}
              or record.get("command") != {"argv": command_argv}
              or record.get("runtime")
              != {
                  "node": "22.23.1",
                  "node_module_abi": "127",
                  "npm": "10.9.8",
                  "platform": "linux",
                  "architecture": "x64",
              }
              or record.get("evidence_boundary")
              != {
                  "establishes": establishes,
                  "does_not_establish": does_not_establish,
              }
          ):
              fail("candidate run record contract is invalid")

          result = record.get("result")
          if result != {
              "exit_code": 0,
              "stdout": {
                  "file": "pilot-evidence-check.stdout",
                  "media_type": "application/jsonl; charset=utf-8",
                  "sha256": digest(stdout),
                  "byte_length": len(stdout),
                  "line_count": 1,
              },
              "stderr": {
                  "sha256": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
                  "byte_length": 0,
              },
          }:
              fail("candidate run result identity is invalid")

          inputs = []
          for path in input_paths:
              source_bytes = read_regular(source / path, 4 * 1024 * 1024)
              inputs.append(
                  {
                      "path": path,
                      "sha256": digest(source_bytes),
                      "byte_length": len(source_bytes),
                  }
              )
          if record.get("inputs") != inputs:
              fail("candidate input identities are invalid")
          manifest = read_regular(
              source / "docs/images/pilot-portfolio-evidence/MANIFEST.json",
              512 * 1024,
          )
          if receipt.get("manifest_sha256") != digest(manifest):
              fail("candidate receipt does not bind the committed manifest")

          verification_files = sorted(
              line
              for line in git(
                  verification,
                  [
                      "diff-tree",
                      "--no-commit-id",
                      "--name-only",
                      "-r",
                      verification_revision,
                  ],
              ).splitlines()
              if line
          )
          if verification_files != expected:
              fail("verification commit scope is not the receipt pair")

          identities = []
          for name in expected:
              value = values[name]
              blob = git_blob(value)
              current = git(source, ["rev-parse", f"{revision}:{name}"]).strip()
              verified = git(
                  verification,
                  ["rev-parse", f"{verification_revision}:{name}"],
              ).strip()
              if verified != blob or current == blob:
                  fail("candidate receipt identity is not a real verified change")
              identities.append(
                  {
                      "path": name,
                      "sha256": digest(value),
                      "byte_length": len(value),
                      "git_blob": blob,
                      "current_blob": current,
                  }
              )

          with zipfile.ZipFile(
              archive,
              mode="x",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
              allowZip64=False,
          ) as output:
              for name in expected:
                  info = zipfile.ZipInfo(name, (1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (stat.S_IFREG | 0o644) << 16
                  output.writestr(info, values[name], compresslevel=9)

          with zipfile.ZipFile(archive, "r", allowZip64=False) as output:
              infos = output.infolist()
              if (
                  [info.filename for info in infos] != expected
                  or output.comment
                  or output.testzip() is not None
              ):
                  fail("candidate archive inventory or integrity is invalid")
              for info in infos:
                  path = PurePosixPath(info.filename)
                  mode = info.external_attr >> 16
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or info.is_dir()
                      or info.flag_bits & 1
                      or info.extra
                      or info.comment
                      or stat.S_IFMT(mode) != stat.S_IFREG
                      or stat.S_IMODE(mode) != 0o644
                      or output.read(info) != values[info.filename]
                  ):
                      fail("candidate archive member is unsafe or inexact")

          archive_bytes = archive.read_bytes()
          audit = {
              "archive_sha256": digest(archive_bytes),
              "archive_bytes": len(archive_bytes),
              "expanded_bytes": sum(map(len, values.values())),
              "entry_count": len(expected),
              "source_revision": revision,
              "source_tree": tree,
              "verification_revision": verification_revision,
              "verification_files": verification_files,
              "files": identities,
          }
          print(json.dumps(audit, separators=(",", ":")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"archive_sha256={audit['archive_sha256']}\n")
              output.write(f"archive_bytes={audit['archive_bytes']}\n")
              output.write(f"entry_count={audit['entry_count']}\n")
          PY

          test "$(git rev-parse --verify 'HEAD^{commit}')" = "${EXPECTED_REVISION}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload the CLI receipt candidate
        id: cli_receipt_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pilot-cli-receipt-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot-cli-receipt-candidate.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Stop before CLI receipt adoption
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.cli_receipt_upload.outputs.artifact-id }}
          ARCHIVE_SHA256: ${{ steps.cli_receipt.outputs.archive_sha256 }}
          ENTRY_COUNT: ${{ steps.cli_receipt.outputs.entry_count }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_ID}"
          test -n "${ARCHIVE_SHA256}"
          test "${ENTRY_COUNT}" -eq 2
          echo "::error title=Pilot CLI receipt review required::The audited two-file candidate is preserved as artifact ${ARTIFACT_ID}; adopt both exact files in a separate reviewed Omar-authored commit."
          exit 1
